    <style>

            background-repeat: repeat; background-size: 100% 100%, 100% 100%, 100% 100%, 250px 250px, 350px 350px, 400px 400px, 200px 200px, 450px 450px, 300px 300px;

        @keyframes drift { 0% { background-position: 0% 0%, 0% 0%, 0% 0%, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px; } 100% { background-position: 0% 0%, 0% 0%, 0% 0%, -250px -250px, -350px -350px, -400px -400px, -200px -200px, -450px -450px, -300px -300px; } }
        #bg-logo-blur { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70vw; max-width: 800px; opacity: 0.12; filter: blur(15px); z-index: -1; pointer-events: none; }

        /* --- Login Screen --- */

        .login-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(178,0,255,0.4); border-radius: 12px; padding: 12px; color: #fff; font-size: 1rem; text-align: center; outline: none; transition: 0.3s; }
        .login-input:focus { border-color: #e066ff; box-shadow: 0 0 10px rgba(224, 102, 255, 0.4); }

        .menu-btn:hover { background: rgba(138, 43, 226, 0.6); border-color: #e066ff; box-shadow: 0 0 20px rgba(138, 43, 226, 0.8); }

        .card-players { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(178, 0, 255, 0.3); padding: 5px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #e066ff; text-transform: uppercase; margin-top: 10px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* --- Modals & Forms --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }

        .modal-container::-webkit-scrollbar { width: 0; background: transparent; }
        .modal-overlay.active .modal-container { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
        .modal-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(to right, #b200ff, #e066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.6rem; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #ccc; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .form-group input, .form-group select { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { background: rgba(0, 0, 0, 0.6); border-color: #b200ff; box-shadow: 0 0 10px rgba(178, 0, 255, 0.4); }

        .nested-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: flex-end; }
        .admin-row { display: grid; gap: 10px; align-items: center; margin-bottom: 10px;}

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 16px; }
        .metric-item { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 0.85rem; font-weight: 700; color: #fff; }

        .history-list-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; max-height: 140px; overflow-y: auto; margin-bottom: 15px; padding: 10px; }
        .history-item { font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .summary-total-strip { margin-top: 20px; padding-top: 15px; border-top: 1px dashed rgba(255, 255, 255, 0.2); display: flex; justify-content: space-between; align-items: center; }

        .total-price { font-size: 1.4rem; font-weight: 800; color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.3); }

        .action-button { width: 100%; background: linear-gradient(90deg, #5900ff, #b200ff); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px; color: white; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(89, 0, 255, 0.4); }
        .action-button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(178, 0, 255, 0.6); }
        .action-button.small-btn { padding: 10px; font-size: 0.8rem; margin-top: auto; border-radius: 8px; }
        
        .quick-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; flex: 1; }
        .quick-btn:hover { background: rgba(255,255,255,0.15); border-color:#e066ff; }
        
        .extra-time-btn { background: linear-gradient(90deg, #1e88e5, #42a5f5); box-shadow: 0 4px 15px rgba(30, 136, 229, 0.4); }
        .release-button { background: linear-gradient(90deg, #d32f2f, #f44336); box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); }
        .success-btn { background: linear-gradient(90deg, #00b347, #00ff66); color: #000; border: none; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4); }

        .log-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; margin-top: 10px;}
        .log-table th { background: rgba(0,0,0,0.3); color: #e066ff; padding: 12px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .log-table td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ddd; }
        
        .revenue-tracker { text-align: center; margin-bottom: 30px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; border: 1px solid rgba(0, 255, 102, 0.3); }
        .revenue-label { font-size: 0.8rem; color: #ccc; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        .revenue-amount { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; color: #00ff66; text-shadow: 0 0 25px rgba(0, 255, 102, 0.4); line-height: 1.2; }

        @media (max-width: 850px) {
            body { padding: 10px; align-items: flex-start; }
            .header-panel { flex-direction: column; gap: 15px; padding: 20px; border-radius: 30px; }
            .header-right { position: absolute; top: 25px; right: 20px; }
            .header-title { font-size: 1.8rem; text-align: center; }
            .header-center { margin-left: 0; flex-direction: column; gap: 10px; }
            .logo-placeholder { width: 120px; height: 120px; }
            .main-content { padding: 25px; border-radius: 30px; gap: 30px; }
            .stations-grid { grid-template-columns: 1fr; gap: 20px; }
            .card { min-height: 200px; padding: 25px 20px; }
            .card-number { font-size: 4rem; }
            .card-timer { font-size: 2.8rem; }
            .metrics-grid { grid-template-columns: 1fr; } 
            .nested-row { grid-template-columns: 1fr; gap: 10px; } 
            #login-screen { padding: 15px; }
            .login-box { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <div id="galaxy-background"></div>
    <img src="wgz_prple_logo_3.png" id="bg-logo-blur" alt="">

    <!-- STAFF LOGIN OVERLAY -->
    <div id="login-screen" class="hidden">
        <div class="login-box glass-panel">
            <img src="wgz_prple_logo_3.png" class="login-logo" alt="Logo">
            <h2 class="login-title">CONSOLE ACCESS</h2>
            <input type="email" id="staff-email" class="login-input" placeholder="Mail">
            <input type="password" id="staff-password" class="login-input" placeholder="Password">
            <button class="action-button" style="font-size:1.1rem; padding:15px; margin-top:20px;" onclick="handleLogin()">LOGIN</button>
            <p id="login-error" style="color:#ff3333; font-size:0.8rem; display:none; text-align:center;"></p>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div class="dashboard-wrapper hidden" id="main-app">
        <header class="header-panel glass-panel">
            <div class="header-center">
                <div class="logo-placeholder">
                    <img src="wgz_prple_logo_3.png" alt="Wonder Gamezone Logo">
                </div>
                <h1 class="header-title">Wonder Gamezone</h1>
            </div>
            <div class="header-right">
                <div class="dropdown-container">
                    <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
                    <!-- Updated Dropdown Menu -->
                    <div class="dropdown-content glass-panel" id="mainMenu">
                        <div class="dropdown-item" onclick="openAdminModal()">⚙️ Admin Cockpit</div>
                        <div class="dropdown-item" onclick="openSystemLogsModal()">📜 Session Register</div>
                        <div class="dropdown-item" onclick="requestNotificationPermission(event)">🔔 Enable Alerts</div>
                        <div class="dropdown-item logout-item" onclick="handleLogout()">🚪 Logout App</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content glass-panel">
            <div>
                <div class="section-title">🎮 Active Stations</div>
                <div class="stations-grid" id="in-use-grid"></div>
            </div>
            <div style="margin-top: 10px;">
                <div class="section-title">✅ Available Stations</div>
                <div class="stations-grid" id="available-grid"></div>
            </div>
        </main>
    </div>

    <!-- Universal Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay" onclick="hideActiveModal(event)">
        <div class="modal-container glass-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title-field">Control Terminal</h2>
                <button class="close-btn" onclick="closeTopModal()">&times;</button>
            </div>
            <div id="modal-injected-body"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION (Place keys here)
        // ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyDjLHWHnD02-pR7d6q5pWfsiD4H4_enIuQ",
  authDomain: "console-c1bd3.firebaseapp.com",
  projectId: "console-c1bd3",
  storageBucket: "console-c1bd3.firebasestorage.app",
  messagingSenderId: "422195108380",
  appId: "1:422195108380:web:9a92fcfe293c8eca8c5dd9",
  measurementId: "G-6C0BPQDW8G"
};

        let db, auth;

        try {
            if (firebaseConfig.apiKey !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            }
        } catch(e) { console.error("Firebase init error:", e); }

        // ==========================================
        // 2. GLOBAL STATE & DATA STRUCTURES
        // ==========================================
        const VALID_ADMIN_PASSWORD = "admin"; 
        let isAdminAuthenticated = false;
        let targetedActiveStationId = null;
        let unsubscribeStations = null;

        let inventoryData = [
            { id: 'inv_1', name: 'Classic Burger', price: 7.00, stock: 10 },
            { id: 'inv_2', name: 'Energy Soda', price: 3.00, stock: 20 },
            { id: 'inv_cig', name: 'Cigarette', price: 20.00, stock: 100 },
            { id: 'inv_drink', name: 'Cold Drink', price: 50.00, stock: 100 }
        ];

        function createStation(id) {
            return {
                id: id, status: 'AVAILABLE', timeRemaining: 0, durationMinutes: 0,
                startTimestamp: null, endTimestamp: null, playersCount: 1, playerNames: '',
                foodHistory: [], miscServiceFee: 0, extraTimeCost: 0, extraTimeAdded: 0,
                rate1Player: 15.00, rateMultiPlayer: 20.00 
            };
        }

        let stationsData = Array.from({ length: 9 }, (_, idx) => createStation(idx + 1));
        let systemAuditLogs = [];

        // ==========================================
        // 3. PERSISTENT DATA SYNC (Cloud & Local)
        // ==========================================
        function saveSystemData() {
            if (db) {
                stationsData.forEach(st => {
                    db.collection('stations').doc(st.id.toString()).set(st, {merge: true});
                });
            }
            localStorage.setItem('wgz_stations', JSON.stringify(stationsData));
            localStorage.setItem('wgz_logs', JSON.stringify(systemAuditLogs));
            localStorage.setItem('wgz_inventory', JSON.stringify(inventoryData));
        }

        function pushLogToCloud(logEntry) {
            if (db) db.collection('logs').doc(logEntry.id).set(logEntry);
            systemAuditLogs.unshift(logEntry);
            localStorage.setItem('wgz_logs', JSON.stringify(systemAuditLogs));
        }

        function bootCloudListeners() {
            if (!db) return;
            if(unsubscribeStations) unsubscribeStations();
            
            unsubscribeStations = db.collection('stations').onSnapshot(snap => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const idx = stationsData.findIndex(s => s.id === parseInt(doc.id));
                    if (idx !== -1) {
                        stationsData[idx] = { ...stationsData[idx], ...data };
                        if(data.startTimestamp && data.startTimestamp.toDate) stationsData[idx].startTimestamp = data.startTimestamp.toDate();
                        if(data.endTimestamp && data.endTimestamp.toDate) stationsData[idx].endTimestamp = data.endTimestamp.toDate();
                    } else {
                        const newSt = createStation(parseInt(doc.id));
                        Object.assign(newSt, data);
                        if(data.startTimestamp && data.startTimestamp.toDate) newSt.startTimestamp = data.startTimestamp.toDate();
                        if(data.endTimestamp && data.endTimestamp.toDate) newSt.endTimestamp = data.endTimestamp.toDate();
                        stationsData.push(newSt);
                    }
                });
                refreshDashboardVisuals();
            });
        }

        function loadLocalFallback() {
            const savedStations = localStorage.getItem('wgz_stations');
            if (savedStations) {
                let parsed = JSON.parse(savedStations);
                stationsData = parsed.map((st, i) => {
                    let merged = { ...createStation(st.id || (i + 1)), ...st };
                    if (merged.startTimestamp) merged.startTimestamp = new Date(merged.startTimestamp);
                    if (merged.endTimestamp) merged.endTimestamp = new Date(merged.endTimestamp);
                    
                    merged.rate1Player = parseFloat(merged.rate1Player) || 15;
                    merged.rateMultiPlayer = parseFloat(merged.rateMultiPlayer) || 20;
                    merged.durationMinutes = parseInt(merged.durationMinutes) || 0;
                    merged.extraTimeAdded = parseInt(merged.extraTimeAdded) || 0;
                    merged.miscServiceFee = parseFloat(merged.miscServiceFee) || 0;
                    merged.extraTimeCost = parseFloat(merged.extraTimeCost) || 0;
                    merged.foodHistory = merged.foodHistory || [];
                    
                    return merged;
                });
            }
            
            const savedLogs = localStorage.getItem('wgz_logs');
            if (savedLogs) systemAuditLogs = JSON.parse(savedLogs);

            const savedInv = localStorage.getItem('wgz_inventory');
            if (savedInv) inventoryData = JSON.parse(savedInv);

            if(!db) refreshDashboardVisuals(); 
        }

        // ==========================================
        // 4. AUTHENTICATION & UI
        // ==========================================
        function checkLoginState() {
            const isLoggedIn = sessionStorage.getItem('wgz_isLoggedIn');
            if (isLoggedIn === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                loadLocalFallback(); 
                bootCloudListeners(); 
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        }

        function handleLogin() {
            const email = document.getElementById('staff-email').value;
            const pass = document.getElementById('staff-password').value;
            const errLabel = document.getElementById('login-error');

            if (!email || !pass) {
                errLabel.textContent = "Please fill all fields.";
                errLabel.style.display = 'block';
                return;
            }

            if (auth) {
                auth.signInWithEmailAndPassword(email, pass).then(() => {
                    sessionStorage.setItem('wgz_isLoggedIn', 'true');
                    requestNotificationPermission(); // Ask for permission politely on successful login
                    checkLoginState();
                }).catch(err => {
                    errLabel.textContent = "Error: " + err.message;
                    errLabel.style.display = 'block';
                });
            } else {
                sessionStorage.setItem('wgz_isLoggedIn', 'true');
                requestNotificationPermission();
                checkLoginState();
            }
        }

        function handleLogout() {
            if(auth) auth.signOut();
            sessionStorage.removeItem('wgz_isLoggedIn');
            isAdminAuthenticated = false; 
            if(unsubscribeStations) unsubscribeStations();
            document.getElementById('mainMenu').classList.remove('show');
            checkLoginState();
        }

        // Explicitly triggers on Login OR manually via menu button. Never randomly during workflow.
        function requestNotificationPermission(event) {
            const menu = document.getElementById('mainMenu');
            if (menu) menu.classList.remove('show');

            if ("Notification" in window) {
                if (Notification.permission === "default") {
                    Notification.requestPermission();
                } else if (Notification.permission === "granted" && event) {
                    alert("Alerts are already enabled!");
                }
            }
        }

        function notifySessionEnd(stationId) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            new Notification(`🎮 Session Ended!`, {
                body: `Time is up for Playstation P${stationId}.`,
                icon: 'wgz_prple_logo_3.png', badge: 'wgz_prple_logo_3.png', vibrate: [200, 100, 200]
            });
        }

        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function get12HourTime(dateObj) {
            if (!dateObj) return '--:--';
            let hours = dateObj.getHours(), minutes = dateObj.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function getTimerColorClass(secondsLeft, totalDurationSeconds) {
            if (secondsLeft <= 0) return 'timer-critical';
            const executionPercentage = (secondsLeft / totalDurationSeconds);
            if (executionPercentage <= 0.20) return 'timer-critical';
            if (executionPercentage <= 0.50) return 'timer-warning';
            return 'timer-safe';
        }

        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('mainMenu').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }

        // ==========================================
        // 5. RENDERING GRID & ACTIVE PANELS
        // ==========================================
        function refreshDashboardVisuals() {
            stationsData.sort((a,b) => a.id - b.id);
            
            const inUseGrid = document.getElementById('in-use-grid');
            const availableGrid = document.getElementById('available-grid');
            inUseGrid.innerHTML = ''; availableGrid.innerHTML = '';

            stationsData.forEach(station => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => launchStationConsole(station.id);

                if (station.status === 'IN_USE' || station.status === 'SETTLING') {
                    const colorStateClass = getTimerColorClass(station.timeRemaining, (station.durationMinutes + station.extraTimeAdded) * 60);
                    let displayNames = station.playerNames ? station.playerNames : `${station.playersCount} Player(s)`;
                    card.innerHTML = `
                        <div class="card-header"><div class="card-number">P${station.id}</div><div class="card-players">👥 ${displayNames}</div></div>
                        <div class="card-timer ${colorStateClass}" id="grid-timer-${station.id}">${formatTime(station.timeRemaining)}</div>
                        <button class="action-button small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🍕 Add Food / Manage</button>
                    `;
                    inUseGrid.appendChild(card);
                } else {
                    card.innerHTML = `
                        <div class="card-header"><div class="card-number" style="color: #666;">P${station.id}</div><div class="card-status">Available Space</div></div>
                        <button class="action-button success-btn small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🚀 Initialize Station</button>
                    `;
                    availableGrid.appendChild(card);
                }
            });
        }

            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');
            titleField.textContent = `Playstation P${station.id}`;

                bodyField.innerHTML = `
                    <div class="form-group">
                        <label>Session Playing Duration</label>
                        <select id="setup-duration">
                            <option value="30">Half Hour (30 mins)</option><option value="60" selected>1 Hour (60 mins)</option>
                            <option value="90">1.5 Hours (90 mins)</option><option value="120">2 Hours (120 mins)</option>
                            <option value="300">5 Hours (300 mins)</option>
                        </select>

                    <div class="form-group"><label>Occupancy (Persons)</label>

                    </div>

                `;

        function renderActiveStationPanel(station) {

            let foodRowsHtml = station.foodHistory.length === 0 ? '<div class="history-item">No food items added yet.</div>' : station.foodHistory.map(f => `
                <div class="history-item" style="align-items: center;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="action-button small-btn release-button" style="margin:0; padding:4px 8px; width:auto; border-radius:6px; box-shadow:none;" onclick="decreaseFoodItem(${station.id}, '${f.id}')">

                <div class="form-group"><input type="text" id="player-names-input" placeholder="Enter Player Names (Optional)..." value="${station.playerNames || ''}" onchange="updatePlayerNames(${station.id}, this.value)" style="border-color: rgba(178, 0, 255, 0.3);"></div>

                    <div class="metric-item"><div class="metric-label">End By</div><div class="metric-value">${get12HourTime(station.endTimestamp)}</div></div>
                    <div class="metric-item"><div class="metric-label">Remaining Time</div><div class="metric-value" id="modal-live-timer" style="font-family:'Orbitron', sans-serif; color:${station.timeRemaining <= 0 ? '#ff3333' : '#00ff66'};">${formatTime(station.timeRemaining)}</div></div>
                    <div class="metric-item"><div class="metric-label">Occupants</div><div class="metric-value">${station.playersCount} Person(s)</div></div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom: 16px;">
                    <button class="action-button small-btn quick-btn" onclick="quickAddItem('Cigarette')">🚬 + Cigarette</button>
                    <button class="action-button small-btn quick-btn" onclick="quickAddItem('Cold Drink')">🥤 + Drink</button>
                </div>

                <div class="form-group nested-row">

        // ==========================================
        // 6. FOOD & SESSION MANAGEMENT LOGIC
        // ==========================================
        function updatePlayerNames(stationId, val) {
            const station = stationsData.find(s => s.id === stationId);
            if(station) { station.playerNames = val; saveSystemData(); refreshDashboardVisuals(); }
        }

        function addExtraTimeBlock() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            station.extraTimeAdded += 5;
            station.endTimestamp = new Date(station.endTimestamp.getTime() + 5 * 60000);
            station.timeRemaining = Math.max(0, Math.floor((station.endTimestamp - new Date()) / 1000));
            station.status = 'IN_USE'; 
            saveSystemData();
            renderActiveStationPanel(station);
            refreshDashboardVisuals();
        }

        function closeTopModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            targetedActiveStationId = null;
        }

        function hideActiveModal(e) { if (e.target.id === 'modal-overlay') closeTopModal(); }

        function commitNewSession() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const duration = parseInt(document.getElementById('setup-duration').value) || 60;
            const now = new Date(); const end = new Date(now.getTime() + duration * 60000);

            station.status = 'IN_USE'; station.timeRemaining = duration * 60; station.durationMinutes = duration;
            station.playersCount = parseInt(document.getElementById('setup-players').value);
            station.playerNames = ''; station.startTimestamp = now; station.endTimestamp = end;
            station.foodHistory = []; station.miscServiceFee = 0; station.extraTimeCost = 0; station.extraTimeAdded = 0;

            saveSystemData(); refreshDashboardVisuals(); closeTopModal();
        }

        function quickAddItem(itemName) {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const inventoryItem = inventoryData.find(item => item.name === itemName);
            if (!inventoryItem) return alert("Item not found in inventory.");
            if (inventoryItem.stock <= 0) return alert("Insufficient stock!");

            inventoryItem.stock -= 1; 
            const matchingFoodItem = station.foodHistory.find(f => f.name === inventoryItem.name);
            if (matchingFoodItem) matchingFoodItem.qty += 1; else station.foodHistory.push({ id: inventoryItem.id, name: inventoryItem.name, price: inventoryItem.price, qty: 1 });

            saveSystemData(); renderActiveStationPanel(station);
        }

        function appendFoodToSession() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const invId = document.getElementById('catering-select').value;
            const qty = parseInt(document.getElementById('catering-qty').value) || 0;
            if (invId === 'none' || qty <= 0) return;

            const invItem = inventoryData.find(item => item.id === invId);
            if (!invItem) return;
            if (qty > invItem.stock) return alert("Insufficient stock!");

            invItem.stock -= qty;
            const match = station.foodHistory.find(f => f.name === invItem.name);
            if (match) match.qty += qty; else station.foodHistory.push({ id: invItem.id, name: invItem.name, price: invItem.price, qty: qty });

            saveSystemData(); renderActiveStationPanel(station);
        }

        function decreaseFoodItem(stationId, foodId) {
            const station = stationsData.find(s => s.id === stationId);
            const foodIdx = station.foodHistory.findIndex(f => f.id === foodId);
            if (foodIdx > -1) {
                const food = station.foodHistory[foodIdx];
                food.qty -= 1;
                
                const invItem = inventoryData.find(i => i.id === food.id);
                if (invItem) invItem.stock += 1;

                if (food.qty <= 0) station.foodHistory.splice(foodIdx, 1); 
                saveSystemData();
                renderActiveStationPanel(station);
            }
        }

        function saveActivePanelState() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const sf = document.getElementById('surcharge-fee');
            if (sf) station.miscServiceFee = parseFloat(sf.value) || 0;
            saveSystemData(); closeTopModal();
        }

        // --- Pricing Calculation Using Station Rates ---
        function calculateTotalBalanceSheet(station) {
            const r1 = parseFloat(station.rate1Player) || 15;
            const rm = parseFloat(station.rateMultiPlayer) || 20;
            const activeRate = station.playersCount >= 2 ? rm : r1;
            
            const dur = parseInt(station.durationMinutes) || 0;
            const exTime = parseInt(station.extraTimeAdded) || 0;

            const structuralPlayCost = (dur / 60) * activeRate;
            const extraTimeTotal = (exTime / 60) * activeRate; 
            
            const foodArr = station.foodHistory || [];
            const cateringCostTotal = foodArr.reduce((sum, item) => sum + ((parseFloat(item.price)||0) * (parseInt(item.qty)||0)), 0);
            const manualFees = parseFloat(station.miscServiceFee) || 0;
            
            return {
                appliedRate: activeRate,
                playCost: structuralPlayCost || 0,
                foodCost: cateringCostTotal || 0,
                miscCost: manualFees || 0,
                extraTime: extraTimeTotal || 0,
                grandTotal: (structuralPlayCost + cateringCostTotal + manualFees + extraTimeTotal) || 0
            };
        }

        function recalculateLivePanelBill() {
            if (!targetedActiveStationId) return;
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const sf = document.getElementById('surcharge-fee');
            const tempMisc = sf ? parseFloat(sf.value) : station.miscServiceFee;
            const statements = calculateTotalBalanceSheet({...station, miscServiceFee: tempMisc});
            document.getElementById('panel-bill-display').textContent = `₹${statements.grandTotal.toFixed(2)}`;
        }

        function endSessionManually() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            station.status = 'SETTLING';
            processSessionSettlement(station.id);
        }

        function processSessionSettlement(stationId) {
            if (!stationId) return;
            const station = stationsData.find(s => s.id === stationId);
            if (stationId === targetedActiveStationId) {
                const sf = document.getElementById('surcharge-fee');
                if (sf) station.miscServiceFee = parseFloat(sf.value) || 0;
            }

            const st = calculateTotalBalanceSheet(station);
            const logEntry = { 
                id: 'LOG_' + Date.now(), 
                stationId: station.id || 0, 
                duration: (station.durationMinutes || 0) + (station.extraTimeAdded || 0), 
                players: station.playersCount || 1, 
                playerNames: station.playerNames || '', 
                foodHistory: station.foodHistory ? JSON.parse(JSON.stringify(station.foodHistory)) : [], 
                statements: st, 
                timestamp: new Date().toLocaleDateString() + ' ' + get12HourTime(new Date()) 
            };
            
            pushLogToCloud(logEntry);
            renderBillReceipt(logEntry.id, true, station.id);
        }

        // --- Bill Receipt ---
        function renderBillReceipt(logId, isImmediateSettlement, stationId = null) {
            const log = systemAuditLogs.find(l => l.id === logId);
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = `🧾 Bill - P${log.stationId}`;

            let itemsHtml = log.foodHistory.map(i => `<div class="invoice-line" style="font-size:0.85rem;"><span style="color:#ccc;">${i.name} <strong style="color:#e066ff;">(x${i.qty})</strong></span><span>₹${(i.price * i.qty).toFixed(2)}</span></div>`).join('');
            
            let actionBtn = isImmediateSettlement 
                ? `<button class="action-button success-btn" onclick="flushStationSlot(${stationId})">✅ Clear Station & Close</button>`
                : `<button class="action-button" onclick="openSystemLogsModal()">⬅ Back to Session Register</button>`;

            bodyField.innerHTML = `
                <div class="invoice-block" style="text-align:left;">
                    ${log.playerNames ? `<div style="color:#00ff66; font-size:0.95rem; margin-bottom:15px; font-weight:bold; text-transform:uppercase;">👥 ${log.playerNames}</div>` : ''}
                    <div class="invoice-line" style="font-size:0.9rem; color:#fff; font-weight:bold;"><span>Play Time (${log.duration} Mins) @ ₹${log.statements.appliedRate}/hr</span><span>₹${log.statements.playCost.toFixed(2)}</span></div>
                    ${log.statements.extraTime > 0 ? `<div class="invoice-line" style="font-size:0.85rem; color:#ccc;"><span>Extra Time Surcharge</span><span>₹${log.statements.extraTime.toFixed(2)}</span></div>` : ''}
                    ${log.statements.miscCost > 0 ? `<div class="invoice-line" style="font-size:0.85rem; color:#ccc;"><span>Misc Surcharges</span><span>₹${log.statements.miscCost.toFixed(2)}</span></div>` : ''}
                    <div style="margin-top:15px; margin-bottom:5px; font-weight:bold; color:#b200ff; border-bottom:1px solid rgba(178,0,255,0.3); padding-bottom:5px;">Add-ons & Refreshments</div>
                    ${itemsHtml || '<div style="color:#666; font-size:0.8rem; font-style:italic;">No items ordered.</div>'}
                    <div class="summary-total-strip" style="margin-top:20px;"><span class="total-label">Grand Total</span><span class="total-price" style="font-size:1.8rem;">₹${log.statements.grandTotal.toFixed(2)}</span></div>
                    <div style="margin-top: 25px;">${actionBtn}</div>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function flushStationSlot(stationId) {
            const station = stationsData.find(s => s.id === stationId);
            station.status = 'AVAILABLE'; station.timeRemaining = 0; station.startTimestamp = null; station.endTimestamp = null;
            station.playerNames = ''; station.foodHistory = []; station.miscServiceFee = 0; station.extraTimeCost = 0; station.extraTimeAdded = 0;
            saveSystemData(); refreshDashboardVisuals(); closeTopModal();
        }

                </div>

                <div class="section-title" style="margin-top: 40px; font-size: 0.9rem;">Inventory Management</div>
                <div class="admin-row" style="margin-bottom: 5px;"><label style="font-size: 0.7rem; font-weight: bold; color: #ccc;">Item Name</label><label style="font-size: 0.7rem; font-weight: bold; color: #ccc;">Price (₹)</label><label style="font-size: 0.7rem; font-weight: bold; color: #ccc;">Stock Qty</label><label></label></div>
                ${inventoryHtml}
                <div class="section-title" style="margin-top: 30px; font-size: 0.9rem;">Add New Item</div>
                <div class="admin-row" style="margin-bottom: 8px;"><input type="text" id="new_item_name" placeholder="Name"><input type="number" id="new_item_price" placeholder="Price"><input type="number" id="new_item_stock" placeholder="Stock"><button class="action-button success-btn" style="margin:0; padding:10px 15px;" onclick="addNewInventoryItem()">Add</button></div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function updateStationRates(stationId) {
            const st = stationsData.find(s => s.id === stationId);
            if (st) {
                const r1 = parseFloat(document.getElementById(`st_rate1_${stationId}`).value);
                const r2 = parseFloat(document.getElementById(`st_rate2_${stationId}`).value);
                if (!isNaN(r1)) st.rate1Player = r1;
                if (!isNaN(r2)) st.rateMultiPlayer = r2;
                saveSystemData();
                alert(`Rates for P${stationId} updated successfully.`);
            }
        }

        function addNewStation() {
            const newId = stationsData.length > 0 ? Math.max(...stationsData.map(s => s.id)) + 1 : 1;
            stationsData.push(createStation(newId));
            saveSystemData();
            refreshDashboardVisuals();
            openAdminModal(); 
        }

        function updateInventoryItem(index) {
            const newName = document.getElementById(`inv_name_${index}`).value;
            const newPrice = parseFloat(document.getElementById(`inv_price_${index}`).value);
            const newStock = parseInt(document.getElementById(`inv_stock_${index}`).value);

            if (newName && !isNaN(newPrice) && !isNaN(newStock)) {
                inventoryData[index].name = newName; inventoryData[index].price = newPrice; inventoryData[index].stock = newStock;
                saveSystemData(); alert(`Inventory item [${newName}] updated.`); openAdminModal(); 
            }
        }

        function addNewInventoryItem() {
            const name = document.getElementById('new_item_name').value;
            const price = parseFloat(document.getElementById('new_item_price').value);
            const stock = parseInt(document.getElementById('new_item_stock').value);

            if (name && !isNaN(price) && !isNaN(stock)) {
                inventoryData.push({ id: `inv_${new Date().getTime()}`, name: name, price: price, stock: stock });
                saveSystemData(); openAdminModal(); 
            } else { alert("Please fill out all fields with valid data."); }
        }

        function openSystemLogsModal() {
            document.getElementById('mainMenu').classList.remove('show');
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = "📜 Session Register";
            if (systemAuditLogs.length === 0) {
                bodyField.innerHTML = `<p style="text-align:center; padding:30px; color:#aaa;">No historical session entries found.</p>`;
            } else {
                let rows = systemAuditLogs.map(log => {
                    let totalItems = log.foodHistory ? log.foodHistory.reduce((s, f) => s + f.qty, 0) : 0;
                    let grandTotal = log.statements && log.statements.grandTotal ? log.statements.grandTotal : 0;
                    return `<tr><td>P${log.stationId}</td><td>${log.duration}m</td><td style="max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${log.playerNames||log.players}</td><td>${totalItems} Items</td><td style="color:#00ff66; font-weight:700;">₹${grandTotal.toFixed(2)}</td><td><button class="action-button small-btn" style="padding: 4px 8px; margin:0;" onclick="renderBillReceipt('${log.id}', false)">View</button></td></tr>`;
                }).join('');
                bodyField.innerHTML = `<div class="log-table-wrapper"><table class="log-table"><thead><tr><th>Stn</th><th>Time</th><th>Names</th><th>Food</th><th>Total</th><th>Bill</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            }
            document.getElementById('modal-overlay').classList.add('active');
        }

        // ==========================================
        // 8. TICK ENGINE (Resilient to Refreshes)
        // ==========================================
        setInterval(() => {
            const now = new Date();
            stationsData.forEach(station => {
                if (station.status === 'IN_USE' && station.endTimestamp) {
                    
                    const diffSeconds = Math.floor((station.endTimestamp - now) / 1000);
                    station.timeRemaining = Math.max(0, diffSeconds);

                    const gridTimer = document.getElementById(`grid-timer-${station.id}`);
                    if (gridTimer) {
                        gridTimer.textContent = formatTime(station.timeRemaining);
                        gridTimer.className = `card-timer ${getTimerColorClass(station.timeRemaining, (station.durationMinutes + station.extraTimeAdded) * 60)}`;
                    }

                    if (targetedActiveStationId === station.id) {
                        const modalTimer = document.getElementById('modal-live-timer');
                        if (modalTimer) {
                            modalTimer.textContent = formatTime(station.timeRemaining);
                            modalTimer.style.color = station.timeRemaining <= 0 ? '#ff3333' : '#00ff66';
                        }
                    }

                    if (station.timeRemaining <= 0) {
                        notifySessionEnd(station.id);
                        station.status = 'SETTLING';
                        saveSystemData();
                        processSessionSettlement(station.id);
                    }
                }
            });
        }, 1000);

        // Boot Application
        window.onload = checkLoginState;
    </script>
</body>
</html>
