<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wonder Gamezone - Administration</title>
    
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wonder GZ">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="wgz_prple_logo_3.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- === FIREBASE SDKs === -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow-x: hidden; background-color: #0d0d0d; user-select: none; -webkit-user-select: none; }
        input, select, textarea { user-select: auto; -webkit-user-select: auto; }
        .hidden { display: none !important; }

        /* --- Tech Grey & Subtle Orange Background --- */
        #tech-background {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; 
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 106, 0, 0.05) 0%, transparent 40%), 
                radial-gradient(circle at 85% 20%, rgba(150, 150, 150, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 123, 0, 0.03) 0%, transparent 50%),
                radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 25px 25px;
        }

        /* --- Authentic Linear Arcade Chase Animation --- */
        #arcade-track { 
            position: fixed; bottom: 5%; left: 0; width: 100vw; height: 60px; 
            z-index: -1; pointer-events: none; opacity: 0.25; 
            border-bottom: 2px dashed rgba(255, 204, 0, 0.1); 
        }
        
        .arcade-entity { 
            position: absolute; bottom: 10px; font-size: 2.2rem;
            animation: arcadeChase 18s linear infinite; 
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        .pacman-wrapper { animation-delay: -4s; }
        .ghost-blinky { animation-delay: -3s; filter: hue-rotate(0deg); }   
        .ghost-pinky  { animation-delay: -2.3s; filter: hue-rotate(300deg); } 
        .ghost-inky   { animation-delay: -1.6s; filter: hue-rotate(180deg); } 
        .ghost-clyde  { animation-delay: -0.9s; filter: hue-rotate(90deg); }  
        
        .pacman {
            width: 0; height: 0;
            border-right: 18px solid transparent; border-top: 18px solid #ffcc00;
            border-left: 18px solid #ffcc00; border-bottom: 18px solid #ffcc00;
            border-radius: 50%; animation: chomp 0.3s ease-in-out infinite;
        }

        @keyframes arcadeChase { 0% { left: -100px; } 100% { left: 110vw; } }
        @keyframes chomp { 0%, 100% { border-right: 18px solid transparent; } 50% { border-right: 18px solid #ffcc00; } }

        /* --- Login Screen --- */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: rgba(15, 15, 18, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(200, 200, 200, 0.15); border-bottom: 3px solid #ff6a00; border-radius: 20px; padding: 50px 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px rgba(255, 106, 0, 0.05); width: 100%; max-width: 400px; }
        .login-logo { width: 140px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.1)); }
        .login-title { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; text-transform: uppercase; background: linear-gradient(90deg, #ffffff, #aaaaaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        
        /* --- Themed Inputs --- */
        .themed-input { width: 100%; background: rgba(0,0,0,0.7); border: 1px solid rgba(120, 120, 120, 0.3); border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .themed-input:focus { border-color: #ff6a00; box-shadow: 0 0 10px rgba(255, 106, 0, 0.2); }
        .themed-input option, .themed-input optgroup { background-color: #1a1a1a; color: #fff; }

        /* --- Global & Glassmorphism --- */
        .glass-panel { background: rgba(25, 25, 25, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-top: 1px solid rgba(255, 255, 255, 0.1); border-left: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); }
        .dashboard-wrapper { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        
        .header-panel { border-radius: 20px; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 50; border-bottom: 2px solid rgba(255, 106, 0, 0.3); }
        .header-brand { display: flex; align-items: center; gap: 15px; }
        .header-logo-small { width: 50px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .header-title { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; background: linear-gradient(90deg, #ffffff, #bbbbbb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-subtitle { font-size: 0.8rem; color: #ff6a00; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; font-weight: bold; }
        
        .location-switcher { background: rgba(0,0,0,0.8); border: 1px solid #555; color: #fff; padding: 8px 15px; border-radius: 8px; font-weight: bold; outline: none; }
        .location-switcher:focus { border-color: #ff6a00; }
        .location-switcher option { background: #1a1a1a; }

        /* --- Dropdown Menu --- */
        .dropdown-container { position: relative; }
        .menu-btn { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 18px; border-radius: 8px; color: #fff; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .menu-btn:hover { border-color: #ff6a00; color: #ff6a00; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 130%; min-width: 240px; flex-direction: column; border-radius: 12px; overflow: hidden; z-index: 1000; border: 1px solid rgba(150, 150, 150, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
        .dropdown-content.show { display: flex; }
        .dropdown-item { padding: 16px 20px; cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.8rem; color: #ccc; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .dropdown-item:hover { background: rgba(255, 106, 0, 0.1); color: #fff; }
        .logout-item { color: #ff4444; }

        /* --- Workspace & Cards --- */
        .main-content { border-radius: 30px; padding: 40px; display: flex; flex-direction: column; gap: 40px; position: relative; z-index: 10; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; color: #dddddd; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; letter-spacing: 1px; }
        .section-title::after { content: ""; flex-grow: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent); }
        .stations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { background: rgba(30, 30, 35, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 25px 20px; min-height: 240px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .card:hover { transform: translateY(-4px); border-color: rgba(255, 106, 0, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(255, 106, 0, 0.05); }
        .card-number { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; background: linear-gradient(180deg, #ffffff 0%, #888888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1;}
        .card-players { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 106, 0, 0.2); padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; color: #ff8c00; margin-top: 10px; letter-spacing: 1px; }
        .card-timer { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; margin: 10px 0; }
        .timer-safe { color: #aaaaaa; } 
        .timer-warning { color: #ffaa00; text-shadow: 0 0 10px rgba(255, 170, 0, 0.2); }
        .timer-critical { color: #ff4444; text-shadow: 0 0 15px rgba(255, 68, 68, 0.4); animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.4; } }

        /* --- Modals & Forms --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-container { position: relative; border-radius: 16px; width: 90%; max-width: 700px; padding: 30px; max-height: 90vh; overflow-y: auto; background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(100,100,100,0.2); border-top: 2px solid #ff6a00; box-shadow: 0 25px 50px rgba(0,0,0,1); }
        .modal-container::-webkit-scrollbar { width: 4px; background: transparent; }
        .modal-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 15px; }
        .modal-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(to right, #ffffff, #aaaaaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-btn { background: none; border: none; color: #666; font-size: 1.8rem; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #ff6a00; }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        
        .nested-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: flex-end; }
        .admin-row { display: grid; gap: 10px; align-items: center; margin-bottom: 10px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(0, 0, 0, 0.5); padding: 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 16px; }
        .history-list-box { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 10px; max-height: 140px; overflow-y: auto; margin-bottom: 15px; padding: 10px; }
        .history-item { font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; color: #bbb; border-bottom: 1px solid rgba(255,255,255,0.02); }

        /* --- Buttons --- */
        .action-button { width: 100%; background: linear-gradient(90deg, #2a2a2a, #3a3a3a); border: 1px solid rgba(255, 106, 0, 0.3); border-radius: 8px; padding: 12px; color: white; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
        .action-button:hover { background: linear-gradient(90deg, #cc5500, #ff6a00); border-color: #ff6a00; box-shadow: 0 5px 15px rgba(255, 106, 0, 0.3); }
        .action-button.small-btn { padding: 10px; font-size: 0.75rem; border-radius: 6px; }
        
        .quick-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.1); flex: 1; color: #ccc; }
        .quick-btn:hover { background: rgba(255, 106, 0, 0.1); border-color: #ff6a00; color: #fff; }
        .release-button { background: linear-gradient(90deg, #8b0000, #b22222); border-color: #ff4444; }
        .release-button:hover { background: linear-gradient(90deg, #b22222, #ff4444); box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3); }
        .success-btn { background: linear-gradient(90deg, #333333, #444444); color: #fff; border: 1px solid #ff6a00; }
        .success-btn:hover { background: linear-gradient(90deg, #cc5500, #ff6a00); color: #fff; }
        .ghost-btn { background: transparent; border: 1px solid #666; color: #aaa; }
        .ghost-btn:hover { border-color: #ff6a00; color: #ff6a00; background: transparent; box-shadow: none; }

        /* Global Save Bar inside Modal */
        #global-save-bar { position: sticky; bottom: -30px; left: 0; width: 100%; background: rgba(20,20,20,0.95); padding: 15px; border-top: 1px solid #ff6a00; box-shadow: 0 -10px 20px rgba(0,0,0,0.8); z-index: 100; transform: translateY(100%); opacity: 0; transition: 0.3s; }
        #global-save-bar.active { transform: translateY(0); opacity: 1; bottom: 0;}

        /* --- Tables & Finance --- */
        .log-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; margin-top: 10px;}
        .log-table th { background: rgba(0,0,0,0.5); color: #888; padding: 12px; text-transform: uppercase; border-bottom: 1px solid #ff6a00; letter-spacing: 1px; }
        .log-table td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ccc; }
        
        .finance-tracker { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; text-align: center; }
        .finance-card { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .finance-card.profit { border-bottom: 2px solid #00cc55; }
        .finance-card.loss { border-bottom: 2px solid #ff4444; }
        .finance-label { font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px;}
        .finance-amt { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; color: #fff; }
        .color-orange { color: #ff8c00; }
    </style>
</head>
<body>

    <div id="tech-background"></div>
    
    <div id="arcade-track">
        <div class="arcade-entity pacman-wrapper"><div class="pacman"></div></div>
        <div class="arcade-entity ghost-blinky">👻</div>
        <div class="arcade-entity ghost-pinky">👻</div>
        <div class="arcade-entity ghost-inky">👻</div>
        <div class="arcade-entity ghost-clyde">👻</div>
    </div>

    <!-- STAFF LOGIN OVERLAY -->
    <div id="login-screen">
        <div class="login-box glass-panel">
            <img src="wgz_prple_logo_3.png" alt="Wonder GZ Logo" class="login-logo">
            <h2 class="login-title">System Auth</h2>
            <input type="email" id="staff-email" class="themed-input" style="text-align:center;" placeholder="Staff ID / Email">
            <input type="password" id="staff-password" class="themed-input" style="text-align:center;" placeholder="Passcode">
            <button class="action-button" style="font-size:1rem; padding:12px; margin-top:20px;" onclick="handleLogin()">LOGIN</button>
            <p id="login-error" style="color:#ff4444; font-size:0.8rem; display:none; text-align:center;"></p>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div class="dashboard-wrapper hidden" id="main-app">
        <header class="header-panel glass-panel">
            <div class="header-brand">
                <img src="wgz_prple_logo_3.png" alt="Logo" class="header-logo-small">
                <div>
                    <h1 class="header-title">Wonder Gamezone</h1>
                    <div class="header-subtitle" id="header-loc-title">Loading Branch...</div>
                </div>
            </div>
            
            <div style="display:flex; align-items:center; gap:15px;">
                <select id="master-location-switcher" class="location-switcher hidden" onchange="switchLocation(this.value)">
                    <option value="loc_delhi_01">Delhi 01</option>
                    <option value="loc_gurugram_01">Gurugram 01</option>
                    <option value="loc_mumbai_01">Mumbai 01</option>
                </select>

                <div class="dropdown-container">
                    <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
                    <div class="dropdown-content glass-panel" id="mainMenu">
                        <div class="dropdown-item" onclick="openAdminModal()">⚙️ Admin Cockpit</div>
                        <div class="dropdown-item" onclick="openSystemLogsModal()">📜 Session Register</div>
                        <div class="dropdown-item logout-item" onclick="handleLogout()">🚪 Logout App</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content glass-panel">
            <div>
                <div class="section-title">🎮 Active Stations</div>
                <div class="stations-grid" id="in-use-grid"></div>
            </div>
            <div style="margin-top: 10px;">
                <div class="section-title">✅ Available Stations</div>
                <div class="stations-grid" id="available-grid"></div>
            </div>
        </main>
    </div>

    <!-- Universal Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay" onclick="hideActiveModal(event)">
        <div class="modal-container glass-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title-field">Control Terminal</h2>
                <button class="close-btn" onclick="closeTopModal()">&times;</button>
            </div>
            <div id="modal-injected-body" style="padding-bottom: 20px;"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyDjLHWHnD02-pR7d6q5pWfsiD4H4_enIuQ",
          authDomain: "console-c1bd3.firebaseapp.com",
          projectId: "console-c1bd3",
          storageBucket: "console-c1bd3.firebasestorage.app",
          messagingSenderId: "422195108380",
          appId: "1:422195108380:web:9a92fcfe293c8eca8c5dd9",
          measurementId: "G-6C0BPQDW8G"
        };

        let db, auth;
        try {
            if (firebaseConfig.apiKey !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            }
        } catch(e) { console.error("Firebase init error:", e); }

        // ==========================================
        // 2. GLOBAL STATE & DATA STRUCTURES
        // ==========================================
        let targetedActiveStationId = null;
        let unsubscribeStations = null;
        
        let currentLocationId = 'default_loc';
        let currentUserRole = 'manager';

        let inventoryData = [
            { id: 'inv_1', name: 'Classic Burger', category: 'Food', price: 7.00, stock: 10, isShortcut: false },
            { id: 'inv_2', name: 'Energy Soda', category: 'Drinks', price: 3.00, stock: 20, isShortcut: true },
            { id: 'inv_cig', name: 'Cigarette', category: 'Misc', price: 20.00, stock: 100, isShortcut: true }
        ];

        function createStation(id) {
            return {
                id: id, status: 'AVAILABLE', timeRemaining: 0, durationMinutes: 0,
                startTimestamp: null, endTimestamp: null, playersCount: 1, playerNames: '',
                foodHistory: [], miscServiceFee: 0, extraTimeCost: 0, extraTimeAdded: 0,
                rate1Player: 15.00, rate2Player: 20.00, rate3Player: 25.00, rate4Player: 30.00,
                lastSessionLogId: null 
            };
        }

        let stationsData = Array.from({ length: 9 }, (_, idx) => createStation(idx + 1));
        let systemAuditLogs = [];
        let expenseLogs = [];

        function getLocDb() { return db ? db.collection('locations').doc(currentLocationId) : null; }

        // ==========================================
        // 3. PERSISTENT DATA SYNC
        // ==========================================
        function saveSystemData() {
            if (db && currentLocationId !== 'ALL') {
                stationsData.forEach(st => getLocDb().collection('stations').doc(st.id.toString()).set(st, {merge: true}));
            }
            localStorage.setItem(`wgz_stations_${currentLocationId}`, JSON.stringify(stationsData));
            localStorage.setItem(`wgz_inventory_${currentLocationId}`, JSON.stringify(inventoryData));
            localStorage.setItem(`wgz_expenses_${currentLocationId}`, JSON.stringify(expenseLogs));
        }

        function pushLogToCloud(logEntry) {
            if (db && currentLocationId !== 'ALL') getLocDb().collection('logs').doc(logEntry.id).set(logEntry);
            systemAuditLogs.unshift(logEntry);
            localStorage.setItem(`wgz_logs_${currentLocationId}`, JSON.stringify(systemAuditLogs));
        }

        function bootCloudListeners() {
            if (!db || currentLocationId === 'ALL') return;
            if(unsubscribeStations) unsubscribeStations();
            
            unsubscribeStations = getLocDb().collection('stations').onSnapshot(snap => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const idx = stationsData.findIndex(s => s.id === parseInt(doc.id));
                    if (idx !== -1) {
                        stationsData[idx] = { ...stationsData[idx], ...data };
                        if(data.startTimestamp && data.startTimestamp.toDate) stationsData[idx].startTimestamp = data.startTimestamp.toDate();
                        if(data.endTimestamp && data.endTimestamp.toDate) stationsData[idx].endTimestamp = data.endTimestamp.toDate();
                    } else {
                        const newSt = createStation(parseInt(doc.id));
                        Object.assign(newSt, data);
                        stationsData.push(newSt);
                    }
                });
                refreshDashboardVisuals();
            });
        }

        function loadLocalFallback() {
            const savedStations = localStorage.getItem(`wgz_stations_${currentLocationId}`);
            if (savedStations) {
                stationsData = JSON.parse(savedStations).map((st, i) => {
                    let merged = { ...createStation(st.id || (i + 1)), ...st };
                    if (merged.startTimestamp) merged.startTimestamp = new Date(merged.startTimestamp);
                    if (merged.endTimestamp) merged.endTimestamp = new Date(merged.endTimestamp);
                    return merged;
                });
            } else { stationsData = Array.from({ length: 9 }, (_, idx) => createStation(idx + 1)); }
            
            const savedLogs = localStorage.getItem(`wgz_logs_${currentLocationId}`);
            systemAuditLogs = savedLogs ? JSON.parse(savedLogs) : [];

        // ==========================================
        // 4. AUTH & MULTI-TENANCY
        // ==========================================
        function checkLoginState() {
            const isLoggedIn = sessionStorage.getItem('wgz_isLoggedIn');
            if (isLoggedIn === 'true') {
                currentLocationId = sessionStorage.getItem('wgz_locId') || 'loc_default';
                currentUserRole = sessionStorage.getItem('wgz_role') || 'manager';

                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                
                if (currentUserRole === 'master') {
                    document.getElementById('master-location-switcher').classList.remove('hidden');
                    document.getElementById('master-location-switcher').value = currentLocationId === 'ALL' ? document.getElementById('master-location-switcher').value : currentLocationId;
                }

                document.getElementById('header-loc-title').textContent = `Branch: ${currentLocationId.replace('loc_', '').toUpperCase()}`;
                loadLocalFallback(); bootCloudListeners(); 
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        }

        async function handleLogin() {
            // Added .trim() to ensure no spaces are accidentally typed in the login box
            const email = document.getElementById('staff-email').value.trim(); 
            const pass = document.getElementById('staff-password').value;
            const errLabel = document.getElementById('login-error');

            if (!email || !pass) { errLabel.textContent = "Please fill all fields."; errLabel.style.display = 'block'; return; }

            if (auth) {
                try {
                    const cred = await auth.signInWithEmailAndPassword(email, pass);
                    
                    // ATTEMPT 1: Look for the UID in the 'users' collection
                    let userDoc = await db.collection('users').doc(cred.user.uid).get();
                    
                    // ATTEMPT 2: Bulletproof Fallback - Look for the Email Address as the ID
                    if (!userDoc.exists) {
                        userDoc = await db.collection('users').doc(email).get();
                    }

                    if(userDoc.exists) {
                        const data = userDoc.data();
                        sessionStorage.setItem('wgz_isLoggedIn', 'true');
                        
                        // Captures 'location_id' perfectly
                        sessionStorage.setItem('wgz_locId', data.location_id || 'ALL'); 
                        sessionStorage.setItem('wgz_role', data.role || 'master');
                        
                        checkLoginState();
                    } else throw new Error("Role profile not found. Please check Document ID.");
                } catch(err) { errLabel.textContent = "Error: " + err.message; errLabel.style.display = 'block'; }
            } else {
                sessionStorage.setItem('wgz_isLoggedIn', 'true');
                sessionStorage.setItem('wgz_locId', 'loc_local_test');
                sessionStorage.setItem('wgz_role', 'master');
                checkLoginState();
            }
        }

        function switchLocation(newLocId) {
            if(unsubscribeStations) unsubscribeStations();
            currentLocationId = newLocId;
            sessionStorage.setItem('wgz_locId', newLocId);
            document.getElementById('header-loc-title').textContent = `Branch: ${newLocId.replace('loc_', '').toUpperCase()}`;
            loadLocalFallback(); bootCloudListeners();
        }

        function handleLogout() {
            if(auth) auth.signOut();
            sessionStorage.clear();
            if(unsubscribeStations) unsubscribeStations();
            document.getElementById('mainMenu').classList.remove('show');
            checkLoginState();
        }

        // ==========================================

        // ==========================================
        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }
        function toggleMenu(e) { e.stopPropagation(); document.getElementById('mainMenu').classList.toggle('show'); }
        window.onclick = function(e) { if (!e.target.matches('.menu-btn')) document.querySelectorAll(".dropdown-content").forEach(d => d.classList.remove('show')); }

        function refreshDashboardVisuals() {
            stationsData.sort((a,b) => a.id - b.id);

            inUseGrid.innerHTML = ''; availableGrid.innerHTML = '';

                    inUseGrid.appendChild(card);
                } else {
                    card.innerHTML = `
                        <div style="text-align:center; width:100%;"><div class="card-number" style="color: #444;">P${station.id}</div></div>
                        <div style="width: 100%; display:flex; flex-direction:column; gap:8px;">
                            <button class="action-button success-btn small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🚀 Initialize</button>
                            ${station.lastSessionLogId ? `<button class="action-button ghost-btn small-btn" onclick="event.stopPropagation(); renderBillReceipt('${station.lastSessionLogId}', false)">📜 Last Bill</button>` : ''}

        function renderActiveStationPanel(station) {
            const bodyField = document.getElementById('modal-injected-body');
            
            let foodRowsHtml = station.foodHistory.length === 0 ? '<div class="history-item">No items added yet.</div>' : station.foodHistory.map(f => `
                <div class="history-item">
                    <span><button class="action-button small-btn release-button" style="padding:4px 8px; width:auto; box-shadow:none; margin-right:5px;" onclick="decreaseFoodItem(${station.id}, '${f.id}')">➖</button>${f.name} (x${f.qty})</span>

            bodyField.innerHTML = `

        // ==========================================
        // 6. PRICING & LOGIC
        // ==========================================
        function calculateTotalBalanceSheet(station) {
            let activeRate = parseFloat(station.rate1Player) || 15;
            if (station.playersCount === 2) activeRate = parseFloat(station.rate2Player) || 20;
            else if (station.playersCount === 3) activeRate = parseFloat(station.rate3Player) || 25;
            else if (station.playersCount >= 4) activeRate = parseFloat(station.rate4Player) || 30;
            
            const dur = parseInt(station.durationMinutes) || 0;
            const playCost = (dur / 60) * activeRate;
            
            const foodArr = station.foodHistory || [];
            const foodCost = foodArr.reduce((sum, item) => sum + ((parseFloat(item.price)||0) * (parseInt(item.qty)||0)), 0);
            
            return { appliedRate: activeRate, playCost: playCost, foodCost: foodCost, grandTotal: (playCost + foodCost) };
        }

        function recalculateLivePanelBill() {
            if (!targetedActiveStationId) return;
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const statements = calculateTotalBalanceSheet(station);
            document.getElementById('panel-bill-display').textContent = `₹${statements.grandTotal.toFixed(2)}`;
        }

        function updatePlayerNames(stationId, val) { const st = stationsData.find(s => s.id === stationId); if(st) { st.playerNames = val; saveSystemData(); refreshDashboardVisuals(); } }
        
        function commitNewSession() {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const hrs = parseInt(document.getElementById('setup-hours').value) || 0;
            const mins = parseInt(document.getElementById('setup-mins').value) || 0;
            const dur = (hrs * 60) + mins;
            
            if (dur <= 0) return alert("Please specify session duration.");

            st.status = 'IN_USE'; st.timeRemaining = dur * 60; st.durationMinutes = dur;
            st.playersCount = parseInt(document.getElementById('setup-players').value);
            st.startTimestamp = new Date(); st.endTimestamp = new Date(st.startTimestamp.getTime() + dur * 60000);
            st.foodHistory = []; st.playerNames = '';
            saveSystemData(); refreshDashboardVisuals(); closeTopModal();
        }

        function quickAddItem(itemName) {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const item = inventoryData.find(i => i.name === itemName);
            if (!item || item.stock <= 0) return alert("Out of stock!");
            item.stock -= 1;
            const match = st.foodHistory.find(f => f.name === item.name);
            if (match) match.qty += 1; else st.foodHistory.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
            saveSystemData(); renderActiveStationPanel(st);
        }

        function appendFoodToSession() {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const invId = document.getElementById('catering-select').value;
            const qty = parseInt(document.getElementById('catering-qty').value) || 0;
            if (invId === 'none' || qty <= 0) return;
            const item = inventoryData.find(i => i.id === invId);
            if (!item || qty > item.stock) return alert("Insufficient inventory!");
            item.stock -= qty;
            const match = st.foodHistory.find(f => f.name === item.name);
            if (match) match.qty += qty; else st.foodHistory.push({ id: item.id, name: item.name, price: item.price, qty: qty });
            saveSystemData(); renderActiveStationPanel(st);
        }

        function decreaseFoodItem(stationId, foodId) {
            const st = stationsData.find(s => s.id === stationId);
            const foodIdx = st.foodHistory.findIndex(f => f.id === foodId);
            if (foodIdx > -1) {
                st.foodHistory[foodIdx].qty -= 1;
                const item = inventoryData.find(i => i.id === foodId);
                if (item) item.stock += 1;
                if (st.foodHistory[foodIdx].qty <= 0) st.foodHistory.splice(foodIdx, 1);
                saveSystemData(); renderActiveStationPanel(st);
            }
        }

        function endSessionManually() {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const sheet = calculateTotalBalanceSheet(st);
            const logEntry = { 
                id: 'LOG_' + Date.now(), stationId: st.id, duration: st.durationMinutes, 
                players: st.playersCount, playerNames: st.playerNames, 
                foodHistory: JSON.parse(JSON.stringify(st.foodHistory)), statements: sheet,
                dateStr: new Date().toLocaleDateString()
            };
            
            pushLogToCloud(logEntry);
            
            st.status = 'AVAILABLE'; st.timeRemaining = 0; st.startTimestamp = null; st.endTimestamp = null; 
            st.foodHistory = []; st.lastSessionLogId = logEntry.id;
            
            saveSystemData(); refreshDashboardVisuals(); 
            renderBillReceipt(logEntry.id, true);
        }

                <button class="action-button ghost-btn small-btn" style="margin-bottom: 25px;" onclick="addNewStation()">➕ Add New Playstation</button>

                <div class="section-title" style="font-size: 0.85rem;">Inventory Configurator</div>
                <div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px; padding-right:5px;">${inventoryHtml}</div>
                
                <div class="section-title" style="margin-top: 15px; font-size: 0.85rem;">Define New Item</div>
                <div class="admin-row" style="grid-template-columns: 1.5fr 1fr 1fr auto;">
                    <input type="text" id="new_item_name" class="themed-input" placeholder="Item Name">
                    <input type="text" id="new_item_cat" class="themed-input" placeholder="Category">
                    <input type="number" id="new_item_price" class="themed-input" placeholder="Price">
                    <button class="action-button success-btn small-btn" onclick="addNewInventory()">Add</button>
                </div>
                
                <!-- STICKY GLOBAL SAVE BAR -->
                <div id="global-save-bar">
                    <button class="action-button success-btn" style="font-size: 1.1rem; letter-spacing: 2px;" onclick="saveAllAdminChanges()">💾 Save All Changes</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        // --- Config Actions ---
        function addNewStation() {
            const newId = stationsData.length > 0 ? Math.max(...stationsData.map(s => s.id)) + 1 : 1;
            stationsData.push(createStation(newId));
            saveSystemData();
            refreshDashboardVisuals();
            openAdminModal(); 
        }

        function addNewInventory() {
            const name = document.getElementById('new_item_name').value;
            const cat = document.getElementById('new_item_cat').value || 'Misc';
            const price = parseFloat(document.getElementById('new_item_price').value);
            if (name && !isNaN(price)) {
                inventoryData.push({ id: `inv_${Date.now()}`, name: name, category: cat, price: price, stock: 100, isShortcut: false });
                saveSystemData(); openAdminModal(); 
            }
        }

        function addExpense() {
            const desc = document.getElementById('new_exp_desc').value;
            const amt = parseFloat(document.getElementById('new_exp_amt').value);
            if (desc && !isNaN(amt)) {
                expenseLogs.push({ id: `EXP_${Date.now()}`, desc: desc, amount: amt, date: new Date().toLocaleDateString() });
                saveSystemData(); openAdminModal();
            }
        }

        // --- CSV Ledger Export ---
        function exportLedgerCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Type,Date,Description/Station,Amount (INR)\n";
            
            systemAuditLogs.forEach(log => {
                const total = log.statements && log.statements.grandTotal ? log.statements.grandTotal : 0;
                csvContent += `Income,${log.dateStr},Station P${log.stationId},${total.toFixed(2)}\n`;
            });
            
            expenseLogs.forEach(exp => {
                csvContent += `Expense,${exp.date},${exp.desc},-${parseFloat(exp.amount).toFixed(2)}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `WGZ_Ledger_${currentLocationId}_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Session Register UI ---
        function openSystemLogsModal() {
            document.getElementById('mainMenu').classList.remove('show');
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = "📜 Session Register Logs";
            if (systemAuditLogs.length === 0) {
                bodyField.innerHTML = `<p style="text-align:center; padding:30px; color:#555;">No records extracted.</p>`;
            } else {
                let rows = systemAuditLogs.map(log => {
                    let totalItems = log.foodHistory ? log.foodHistory.reduce((s, f) => s + f.qty, 0) : 0;
                    let grandTotal = log.statements && log.statements.grandTotal ? log.statements.grandTotal : 0;
                    return `<tr><td>P${log.stationId}</td><td>${log.duration}m</td><td style="max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${log.playerNames||log.players}</td><td>${totalItems} Itm</td><td style="color:#ff8c00; font-weight:700;">₹${grandTotal.toFixed(2)}</td><td><button class="action-button small-btn ghost-btn" style="padding: 4px 8px; margin:0;" onclick="renderBillReceipt('${log.id}', false)">Read</button></td></tr>`;
                }).join('');
                bodyField.innerHTML = `<div class="log-table-wrapper" style="max-height:60vh; overflow-y:auto; border: 1px solid rgba(255,255,255,0.05); border-radius:10px;"><table class="log-table"><thead><tr><th>Station</th><th>Time</th><th>Names</th><th>Items</th><th>Total</th><th>File</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            }
            document.getElementById('modal-overlay').classList.add('active');
        }

        // ==========================================
        // 8. TICK ENGINE
        // ==========================================
        setInterval(() => {
            const now = new Date();
            stationsData.forEach(station => {
                if (station.status === 'IN_USE' && station.endTimestamp) {
                    station.timeRemaining = Math.max(0, Math.floor((station.endTimestamp - now) / 1000));
                    const gridTimer = document.getElementById(`grid-timer-${station.id}`);
                    if (gridTimer) {
                        gridTimer.textContent = formatTime(station.timeRemaining);
                        if (station.timeRemaining <= 300 && station.timeRemaining > 0) gridTimer.className = 'card-timer timer-warning';
                        else if (station.timeRemaining <= 0) gridTimer.className = 'card-timer timer-critical';
                    }
                    
                    if (targetedActiveStationId === station.id) {
                        const modalTimer = document.getElementById('modal-live-timer');
                        if (modalTimer) {
                            modalTimer.textContent = formatTime(station.timeRemaining);
                            if(station.timeRemaining <= 0) modalTimer.style.color = '#ff4444';
                        }
                    }

                    if(station.timeRemaining <= 0) {
                        targetedActiveStationId = station.id;
                        endSessionManually();
                    }
                }
            });
        }, 1000);

        window.onload = checkLoginState;
    </script>
</body>
</html>
