<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wonder Gamezone - Administration</title>
    
    <meta name="theme-color" content="#06010f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wonder GZ">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- === FIREBASE SDKs === -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow-x: hidden; background-color: #05010a; user-select: none; -webkit-user-select: none; }
        input, select, textarea { user-select: auto; -webkit-user-select: auto; }
        .hidden { display: none !important; }

        #galaxy-background {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; background-color: #06010f; 
            background-image: radial-gradient(circle at 15% 50%, rgba(70, 10, 130, 0.4) 0%, transparent 40%), radial-gradient(circle at 85% 20%, rgba(120, 0, 200, 0.25) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(40, 0, 80, 0.5) 0%, transparent 50%), radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 90px 40px, #e8d5ff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)), radial-gradient(1px 1px at 250px 150px, #d4aaff, rgba(0,0,0,0)), radial-gradient(2px 2px at 300px 50px, #ffffff, rgba(0,0,0,0)), radial-gradient(1px 1px at 350px 250px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 100% 100%, 100% 100%, 100% 100%, 250px 250px, 350px 350px, 400px 400px, 200px 200px, 450px 450px, 300px 300px;
            animation: drift 100s linear infinite;
        }

        @keyframes drift { 0% { background-position: 0% 0%, 0% 0%, 0% 0%, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px; } 100% { background-position: 0% 0%, 0% 0%, 0% 0%, -250px -250px, -350px -350px, -400px -400px, -200px -200px, -450px -450px, -300px -300px; } }
        
        /* --- Login Screen --- */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: rgba(20, 5, 35, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(178, 0, 255, 0.3); border-radius: 30px; padding: 50px 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(138, 43, 226, 0.2); width: 100%; max-width: 400px; }
        .login-title { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; text-transform: uppercase; background: linear-gradient(90deg, #b200ff, #e066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(178,0,255,0.4); border-radius: 12px; padding: 12px; color: #fff; font-size: 1rem; text-align: center; outline: none; transition: 0.3s; }
        .login-input:focus { border-color: #e066ff; box-shadow: 0 0 10px rgba(224, 102, 255, 0.4); }

        /* --- Global & Glassmorphism --- */
        .glass-panel { background: rgba(20, 5, 35, 0.25); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.15); border-left: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(138, 43, 226, 0.15); }
        .dashboard-wrapper { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        
        .header-panel { border-radius: 40px; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 50; }
        .header-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; background: linear-gradient(90deg, #b200ff, #e066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-subtitle { font-size: 0.9rem; color: #00ff66; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; font-weight: bold; }
        
        .location-switcher { background: rgba(0,0,0,0.6); border: 1px solid #b200ff; color: #fff; padding: 8px 15px; border-radius: 8px; font-weight: bold; outline: none; }
        .location-switcher option { background: #1a0b2e; }

        /* --- Dropdown Menu --- */
        .dropdown-container { position: relative; }
        .menu-btn { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 18px; border-radius: 12px; color: #fff; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 130%; min-width: 240px; flex-direction: column; border-radius: 16px; overflow: hidden; z-index: 1000; border: 1px solid rgba(178, 0, 255, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .dropdown-content.show { display: flex; }
        .dropdown-item { padding: 16px 20px; cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.8rem; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dropdown-item:hover { background: rgba(178, 0, 255, 0.4); }
        .logout-item { color: #ff3333; }

        /* --- Workspace & Cards --- */
        .main-content { border-radius: 40px; padding: 40px; display: flex; flex-direction: column; gap: 40px; position: relative; z-index: 10; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; color: #ffffff; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ""; flex-grow: 1; height: 1px; background: rgba(178, 0, 255, 0.4); }
        .stations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px 20px; min-height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.03) translateY(-5px); border-color: rgba(224, 102, 255, 0.5); box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4); }
        .card-number { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; background: linear-gradient(180deg, #e066ff 0%, #8a2be2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-players { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(178, 0, 255, 0.3); padding: 5px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #e066ff; margin-top: 10px; }
        .card-timer { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; margin: 10px 0; }
        .timer-safe { color: #00ff66; text-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
        .timer-warning { color: #ffae00; text-shadow: 0 0 15px rgba(255, 174, 0, 0.4); }
        .timer-critical { color: #ff3333; text-shadow: 0 0 20px rgba(255, 51, 51, 0.6); animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.4; } }

        /* --- Modals & Forms --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-container { border-radius: 24px; width: 90%; max-width: 650px; padding: 30px; max-height: 90vh; overflow-y: auto; }
        .modal-container::-webkit-scrollbar { width: 0; background: transparent; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
        .modal-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(to right, #b200ff, #e066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.6rem; cursor: pointer; }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #ccc; }
        .form-group input, .form-group select { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.95rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #b200ff; }
        .form-group select option, .form-group select optgroup { background-color: #1a0b2e; color: #fff; }
        
        .nested-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: flex-end; }
        .admin-row { display: grid; gap: 10px; align-items: center; margin-bottom: 10px;}

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 16px; }
        .history-list-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; max-height: 140px; overflow-y: auto; margin-bottom: 15px; padding: 10px; }
        .history-item { font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .action-button { width: 100%; background: linear-gradient(90deg, #5900ff, #b200ff); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px; color: white; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .action-button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(178, 0, 255, 0.6); }
        .action-button.small-btn { padding: 10px; font-size: 0.8rem; border-radius: 8px; }
        
        .quick-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.2); flex: 1; }
        .quick-btn:hover { background: rgba(255,255,255,0.15); border-color:#e066ff; }
        .release-button { background: linear-gradient(90deg, #d32f2f, #f44336); }
        .success-btn { background: linear-gradient(90deg, #00b347, #00ff66); color: #000; border: none; }

        .log-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; margin-top: 10px;}
        .log-table th { background: rgba(0,0,0,0.3); color: #e066ff; padding: 12px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .log-table td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ddd; }
    </style>
</head>
<body>

    <div id="galaxy-background"></div>

    <!-- STAFF LOGIN OVERLAY -->
    <div id="login-screen">
        <div class="login-box glass-panel">
            <h2 class="login-title">CONSOLE ACCESS</h2>
            <input type="email" id="staff-email" class="login-input" placeholder="Mail">
            <input type="password" id="staff-password" class="login-input" placeholder="Password">
            <button class="action-button" style="font-size:1.1rem; padding:15px; margin-top:20px;" onclick="handleLogin()">LOGIN</button>
            <p id="login-error" style="color:#ff3333; font-size:0.8rem; display:none; text-align:center;"></p>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div class="dashboard-wrapper hidden" id="main-app">
        <header class="header-panel glass-panel">
            <div>
                <h1 class="header-title">Wonder Gamezone</h1>
                <div class="header-subtitle" id="header-loc-title">Loading Branch...</div>
            </div>
            
            <div style="display:flex; align-items:center; gap:15px;">
                <!-- Master Location Switcher -->
                <select id="master-location-switcher" class="location-switcher hidden" onchange="switchLocation(this.value)">
                    <option value="loc_delhi_01">Delhi 01</option>
                    <option value="loc_gurugram_01">Gurugram 01</option>
                    <option value="loc_mumbai_01">Mumbai 01</option>
                </select>

                <div class="dropdown-container">
                    <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
                    <div class="dropdown-content glass-panel" id="mainMenu">
                        <div class="dropdown-item" onclick="openAdminModal()">⚙️ Admin Cockpit</div>
                        <div class="dropdown-item" onclick="openSystemLogsModal()">📜 Session Register</div>
                        <div class="dropdown-item logout-item" onclick="handleLogout()">🚪 Logout App</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content glass-panel">
            <div>
                <div class="section-title">🎮 Active Stations</div>
                <div class="stations-grid" id="in-use-grid"></div>
            </div>
            <div style="margin-top: 10px;">
                <div class="section-title">✅ Available Stations</div>
                <div class="stations-grid" id="available-grid"></div>
            </div>
        </main>
    </div>

    <!-- Universal Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay" onclick="hideActiveModal(event)">
        <div class="modal-container glass-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title-field">Control Terminal</h2>
                <button class="close-btn" onclick="closeTopModal()">&times;</button>
            </div>
            <div id="modal-injected-body"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION (Place keys here)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDjLHWHnD02-pR7d6q5pWfsiD4H4_enIuQ",
            authDomain: "console-c1bd3.firebaseapp.com",
            projectId: "console-c1bd3",
            storageBucket: "console-c1bd3.firebasestorage.app",
            messagingSenderId: "422195108380",
            appId: "1:422195108380:web:9a92fcfe293c8eca8c5dd9",
            measurementId: "G-6C0BPQDW8G"
        };

        let db, auth;
        try {
            if (firebaseConfig.apiKey !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            }
        } catch(e) { console.error("Firebase init error:", e); }

        // ==========================================
        // 2. GLOBAL STATE & DATA STRUCTURES
        // ==========================================
        let targetedActiveStationId = null;
        let unsubscribeStations = null;
        
        // Multi-Location State
        let currentLocationId = 'default_loc';
        let currentUserRole = 'manager';

        // Phase 1: Categorized Menu & Shortcuts Setup
        let inventoryData = [
            { id: 'inv_1', name: 'Classic Burger', category: 'Food', price: 7.00, stock: 10, isShortcut: false },
            { id: 'inv_2', name: 'Energy Soda', category: 'Drinks', price: 3.00, stock: 20, isShortcut: true },
            { id: 'inv_cig', name: 'Cigarette', category: 'Misc', price: 20.00, stock: 100, isShortcut: true }
        ];

        // Phase 1: 3-4 Player Rates added
        function createStation(id) {
            return {
                id: id, status: 'AVAILABLE', timeRemaining: 0, durationMinutes: 0,
                startTimestamp: null, endTimestamp: null, playersCount: 1, playerNames: '',
                foodHistory: [], miscServiceFee: 0, extraTimeCost: 0, extraTimeAdded: 0,
                rate1Player: 15.00, rate2Player: 20.00, rate3Player: 25.00, rate4Player: 30.00 
            };
        }

        let stationsData = Array.from({ length: 9 }, (_, idx) => createStation(idx + 1));
        let systemAuditLogs = [];

        // Helper to scope DB paths per location
        function getLocDb() {
            if (!db) return null;
            return db.collection('locations').doc(currentLocationId);
        }

        // ==========================================
        // 3. PERSISTENT DATA SYNC (Cloud & Local)
        // ==========================================
        function saveSystemData() {
            if (db && currentLocationId !== 'ALL') {
                stationsData.forEach(st => {
                    getLocDb().collection('stations').doc(st.id.toString()).set(st, {merge: true});
                });
            }
            // Scope local storage keys to the specific location so data doesn't bleed across branches
            localStorage.setItem(`wgz_stations_${currentLocationId}`, JSON.stringify(stationsData));
            localStorage.setItem(`wgz_logs_${currentLocationId}`, JSON.stringify(systemAuditLogs));
            localStorage.setItem(`wgz_inventory_${currentLocationId}`, JSON.stringify(inventoryData));
        }

        function pushLogToCloud(logEntry) {
            if (db && currentLocationId !== 'ALL') getLocDb().collection('logs').doc(logEntry.id).set(logEntry);
            systemAuditLogs.unshift(logEntry);
            localStorage.setItem(`wgz_logs_${currentLocationId}`, JSON.stringify(systemAuditLogs));
        }

        function bootCloudListeners() {
            if (!db || currentLocationId === 'ALL') return;
            if(unsubscribeStations) unsubscribeStations();
            
            unsubscribeStations = getLocDb().collection('stations').onSnapshot(snap => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const idx = stationsData.findIndex(s => s.id === parseInt(doc.id));
                    if (idx !== -1) {
                        stationsData[idx] = { ...stationsData[idx], ...data };
                        if(data.startTimestamp && data.startTimestamp.toDate) stationsData[idx].startTimestamp = data.startTimestamp.toDate();
                        if(data.endTimestamp && data.endTimestamp.toDate) stationsData[idx].endTimestamp = data.endTimestamp.toDate();
                    } else {
                        const newSt = createStation(parseInt(doc.id));
                        Object.assign(newSt, data);
                        stationsData.push(newSt);
                    }
                });
                refreshDashboardVisuals();
            });
        }

        function loadLocalFallback() {
            const savedStations = localStorage.getItem(`wgz_stations_${currentLocationId}`);
            if (savedStations) {
                let parsed = JSON.parse(savedStations);
                stationsData = parsed.map((st, i) => {
                    let merged = { ...createStation(st.id || (i + 1)), ...st };
                    if (merged.startTimestamp) merged.startTimestamp = new Date(merged.startTimestamp);
                    if (merged.endTimestamp) merged.endTimestamp = new Date(merged.endTimestamp);
                    return merged;
                });
            } else {
                stationsData = Array.from({ length: 9 }, (_, idx) => createStation(idx + 1));
            }
            
            const savedLogs = localStorage.getItem(`wgz_logs_${currentLocationId}`);
            if (savedLogs) systemAuditLogs = JSON.parse(savedLogs); else systemAuditLogs = [];

            const savedInv = localStorage.getItem(`wgz_inventory_${currentLocationId}`);
            if (savedInv) inventoryData = JSON.parse(savedInv);

            refreshDashboardVisuals(); 
        }

        // ==========================================
        // 4. AUTHENTICATION & MULTI-TENANCY LOGIC
        // ==========================================
        function checkLoginState() {
            const isLoggedIn = sessionStorage.getItem('wgz_isLoggedIn');
            if (isLoggedIn === 'true') {
                currentLocationId = sessionStorage.getItem('wgz_locId') || 'loc_default';
                currentUserRole = sessionStorage.getItem('wgz_role') || 'manager';

                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                
                // Show location switcher for Master
                if (currentUserRole === 'master') {
                    document.getElementById('master-location-switcher').classList.remove('hidden');
                    if(currentLocationId === 'ALL') {
                        currentLocationId = document.getElementById('master-location-switcher').value;
                    } else {
                        document.getElementById('master-location-switcher').value = currentLocationId;
                    }
                }

                document.getElementById('header-loc-title').textContent = `Branch: ${currentLocationId.replace('loc_', '').toUpperCase()}`;
                
                loadLocalFallback(); 
                bootCloudListeners(); 
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('staff-email').value;
            const pass = document.getElementById('staff-password').value;
            const errLabel = document.getElementById('login-error');

            if (!email || !pass) { errLabel.textContent = "Please fill all fields."; errLabel.style.display = 'block'; return; }

            if (auth) {
                try {
                    const cred = await auth.signInWithEmailAndPassword(email, pass);
                    // Fetch user's role and location from Users collection
                    const userDoc = await db.collection('users').doc(cred.user.uid).get();
                    
                    if(userDoc.exists) {
                        const data = userDoc.data();
                        sessionStorage.setItem('wgz_isLoggedIn', 'true');
                        sessionStorage.setItem('wgz_locId', data.location_id);
                        sessionStorage.setItem('wgz_role', data.role);
                        checkLoginState();
                    } else {
                        throw new Error("Role profile not found. Please setup user document in Firestore.");
                    }
                } catch(err) {
                    errLabel.textContent = "Error: " + err.message;
                    errLabel.style.display = 'block';
                }
            } else {
                // Local testing fallback
                sessionStorage.setItem('wgz_isLoggedIn', 'true');
                sessionStorage.setItem('wgz_locId', 'loc_local_test');
                sessionStorage.setItem('wgz_role', 'master');
                checkLoginState();
            }
        }

        function switchLocation(newLocId) {
            if(unsubscribeStations) unsubscribeStations();
            currentLocationId = newLocId;
            sessionStorage.setItem('wgz_locId', newLocId);
            document.getElementById('header-loc-title').textContent = `Branch: ${newLocId.replace('loc_', '').toUpperCase()}`;
            loadLocalFallback();
            bootCloudListeners();
        }

        function handleLogout() {
            if(auth) auth.signOut();
            sessionStorage.clear();
            if(unsubscribeStations) unsubscribeStations();
            document.getElementById('mainMenu').classList.remove('show');
            checkLoginState();
        }

        // ==========================================
        // 5. PHASE 1: RENDERING PANELS & MENUS
        // ==========================================
        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function toggleMenu(e) { e.stopPropagation(); document.getElementById('mainMenu').classList.toggle('show'); }
        window.onclick = function(e) { if (!e.target.matches('.menu-btn')) { document.querySelectorAll(".dropdown-content").forEach(d => d.classList.remove('show')); } }

        function refreshDashboardVisuals() {
            stationsData.sort((a,b) => a.id - b.id);
            const inUseGrid = document.getElementById('in-use-grid');
            const availableGrid = document.getElementById('available-grid');
            inUseGrid.innerHTML = ''; availableGrid.innerHTML = '';

            stationsData.forEach(station => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => launchStationConsole(station.id);

                if (station.status === 'IN_USE' || station.status === 'SETTLING') {
                    let displayNames = station.playerNames ? station.playerNames : `${station.playersCount} Player(s)`;
                    card.innerHTML = `
                        <div style="text-align:center;"><div class="card-number">P${station.id}</div><div class="card-players">👥 ${displayNames}</div></div>
                        <div class="card-timer timer-safe" id="grid-timer-${station.id}">${formatTime(station.timeRemaining)}</div>
                        <button class="action-button small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🍕 Manage</button>
                    `;
                    inUseGrid.appendChild(card);
                } else {
                    card.innerHTML = `
                        <div style="text-align:center;"><div class="card-number" style="color: #666;">P${station.id}</div></div>
                        <button class="action-button success-btn small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🚀 Initialize</button>
                    `;
                    availableGrid.appendChild(card);
                }
            });
        }

        function launchStationConsole(stationId) {
            targetedActiveStationId = stationId;
            const station = stationsData.find(s => s.id === stationId);
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = `Playstation P${station.id}`;

            if (station.status === 'AVAILABLE') {
                bodyField.innerHTML = `
                    <div class="form-group">
                        <label>Session Playing Duration</label>
                        <select id="setup-duration"><option value="30">30 mins</option><option value="60" selected>1 Hour</option><option value="120">2 Hours</option></select>
                    </div>
                    <div class="form-group"><label>Occupancy</label>
                        <select id="setup-players"><option value="1">1 Person</option><option value="2">2 Persons</option><option value="3">3 Persons</option><option value="4">4 Persons</option></select>
                    </div>
                    <button class="action-button" onclick="commitNewSession()">Initialize Station</button>
                `;
            } else {
                renderActiveStationPanel(station);
            }
            document.getElementById('modal-overlay').classList.add('active');
        }

        // --- Phase 1: Categorized Select & Dynamic Shortcuts ---
        function renderActiveStationPanel(station) {
            const bodyField = document.getElementById('modal-injected-body');
            
            let foodRowsHtml = station.foodHistory.length === 0 ? '<div class="history-item">No items added.</div>' : station.foodHistory.map(f => `
                <div class="history-item">
                    <span><button class="action-button small-btn release-button" style="padding:4px 8px; width:auto; box-shadow:none; margin-right:5px;" onclick="decreaseFoodItem(${station.id}, '${f.id}')">➖</button>${f.name} (x${f.qty})</span>
                    <span>₹${(f.price * f.qty).toFixed(2)}</span>
                </div>
            `).join('');

            // Grouping Inventory By Category
            const groupedInventory = inventoryData.reduce((acc, item) => {
                if (item.stock > 0) {
                    if (!acc[item.category]) acc[item.category] = [];
                    acc[item.category].push(item);
                }
                return acc;
            }, {});

            let inventoryOptions = Object.keys(groupedInventory).map(category => {
                let options = groupedInventory[category].map(item => `<option value="${item.id}">${item.name} (₹${item.price.toFixed(2)})</option>`).join('');
                return `<optgroup label="--- ${category.toUpperCase()} ---">${options}</optgroup>`;
            }).join('');

            // Dynamic Shortcuts logic
            let shortcutButtonsHtml = inventoryData
                .filter(item => item.isShortcut && item.stock > 0)
                .map(item => `<button class="action-button small-btn quick-btn" onclick="quickAddItem('${item.name}')">⚡ + ${item.name}</button>`)
                .join('');

            bodyField.innerHTML = `
                <div class="form-group"><input type="text" id="player-names-input" placeholder="Enter Player Names..." value="${station.playerNames || ''}" onchange="updatePlayerNames(${station.id}, this.value)"></div>
                <div class="metrics-grid">
                    <div class="metric-item"><div style="font-size: 0.65rem; color: #aaa;">Remaining Time</div><div id="modal-live-timer" style="color:#00ff66; font-size:1rem; font-weight:bold;">${formatTime(station.timeRemaining)}</div></div>
                    <div class="metric-item"><div style="font-size: 0.65rem; color: #aaa;">Occupants</div><div>${station.playersCount} Person(s)</div></div>
                </div>
                
                <div style="display:flex; gap:10px; margin-bottom: 16px; flex-wrap:wrap;">
                    ${shortcutButtonsHtml || '<span style="font-size:0.7rem; color:#aaa;">No shortcuts configured.</span>'}
                </div>
                
                <div class="form-group"><div class="history-list-box">${foodRowsHtml}</div></div>
                <div class="form-group nested-row">
                    <select id="catering-select"><option value="none">-- Select Item --</option>${inventoryOptions}</select>
                    <input type="number" id="catering-qty" min="1" value="1">
                    <button class="action-button" style="margin:0; padding:10px;" onclick="appendFoodToSession()">Add</button>
                </div>
                
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #666; padding-top:15px; margin-top:20px;">
                    <span style="color:#e066ff; font-weight:bold;">Accrued Balance:</span>
                    <span id="panel-bill-display" style="font-size:1.5rem; color:#00ff66; font-weight:bold;">₹0.00</span>
                </div>
                <button class="action-button release-button" style="margin-top:20px;" onclick="endSessionManually()">Settle & End Session</button>
            `;
            recalculateLivePanelBill();
        }

        // ==========================================
        // 6. PRICING & LOGIC (Phase 1 logic handling)
        // ==========================================
        function calculateTotalBalanceSheet(station) {
            let activeRate = parseFloat(station.rate1Player) || 15;
            if (station.playersCount === 2) activeRate = parseFloat(station.rate2Player) || 20;
            else if (station.playersCount === 3) activeRate = parseFloat(station.rate3Player) || 25;
            else if (station.playersCount >= 4) activeRate = parseFloat(station.rate4Player) || 30;
            
            const dur = parseInt(station.durationMinutes) || 0;
            const playCost = (dur / 60) * activeRate;
            
            const foodArr = station.foodHistory || [];
            const foodCost = foodArr.reduce((sum, item) => sum + ((parseFloat(item.price)||0) * (parseInt(item.qty)||0)), 0);
            
            return { appliedRate: activeRate, playCost: playCost, foodCost: foodCost, grandTotal: (playCost + foodCost) };
        }

        function recalculateLivePanelBill() {
            if (!targetedActiveStationId) return;
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const statements = calculateTotalBalanceSheet(station);
            document.getElementById('panel-bill-display').textContent = `₹${statements.grandTotal.toFixed(2)}`;
        }

        function updatePlayerNames(stationId, val) { const st = stationsData.find(s => s.id === stationId); if(st) { st.playerNames = val; saveSystemData(); refreshDashboardVisuals(); } }
        function commitNewSession() {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const dur = parseInt(document.getElementById('setup-duration').value) || 60;
            st.status = 'IN_USE'; st.timeRemaining = dur * 60; st.durationMinutes = dur;
            st.playersCount = parseInt(document.getElementById('setup-players').value);
            st.startTimestamp = new Date(); st.endTimestamp = new Date(st.startTimestamp.getTime() + dur * 60000);
            st.foodHistory = []; st.playerNames = '';
            saveSystemData(); refreshDashboardVisuals(); closeTopModal();
        }

        function quickAddItem(itemName) {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const item = inventoryData.find(i => i.name === itemName);
            if (!item || item.stock <= 0) return alert("Unavailable!");
            item.stock -= 1;
            const match = st.foodHistory.find(f => f.name === item.name);
            if (match) match.qty += 1; else st.foodHistory.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
            saveSystemData(); renderActiveStationPanel(st);
        }

        function appendFoodToSession() {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            const invId = document.getElementById('catering-select').value;
            const qty = parseInt(document.getElementById('catering-qty').value) || 0;
            if (invId === 'none' || qty <= 0) return;
            const item = inventoryData.find(i => i.id === invId);
            if (!item || qty > item.stock) return alert("Insufficient stock!");
            item.stock -= qty;
            const match = st.foodHistory.find(f => f.name === item.name);
            if (match) match.qty += qty; else st.foodHistory.push({ id: item.id, name: item.name, price: item.price, qty: qty });
            saveSystemData(); renderActiveStationPanel(st);
        }

        function decreaseFoodItem(stationId, foodId) {
            const st = stationsData.find(s => s.id === stationId);
            const foodIdx = st.foodHistory.findIndex(f => f.id === foodId);
            if (foodIdx > -1) {
                st.foodHistory[foodIdx].qty -= 1;
                const item = inventoryData.find(i => i.id === foodId);
                if (item) item.stock += 1;
                if (st.foodHistory[foodIdx].qty <= 0) st.foodHistory.splice(foodIdx, 1);
                saveSystemData(); renderActiveStationPanel(st);
            }
        }

        function endSessionManually() {
            const st = stationsData.find(s => s.id === targetedActiveStationId);
            st.status = 'SETTLING';
            const sheet = calculateTotalBalanceSheet(st);
            const logEntry = { id: 'LOG_' + Date.now(), stationId: st.id, duration: st.durationMinutes, players: st.playersCount, playerNames: st.playerNames, foodHistory: JSON.parse(JSON.stringify(st.foodHistory)), statements: sheet };
            pushLogToCloud(logEntry);
            
            st.status = 'AVAILABLE'; st.timeRemaining = 0; st.startTimestamp = null; st.endTimestamp = null; st.foodHistory = [];
            saveSystemData(); refreshDashboardVisuals(); closeTopModal();
            alert(`Session Closed. Bill: ₹${sheet.grandTotal.toFixed(2)}`);
        }

        // ==========================================
        // 7. ADMIN COCKPIT (Phase 1 configuration handling)
        // ==========================================
        function closeTopModal() { document.getElementById('modal-overlay').classList.remove('active'); }
        function hideActiveModal(e) { if (e.target.id === 'modal-overlay') closeTopModal(); }

        function openAdminModal() {
            document.getElementById('mainMenu').classList.remove('show');
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = "⚙️ Admin Cockpit";

            // Station Pricing Form
            let stationsHtml = stationsData.map(st => `
                <div class="admin-row" style="grid-template-columns: 30px 1fr 1fr 1fr 1fr auto; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom:10px;">
                    <div style="color:#fff; font-weight:bold;">P${st.id}</div>
                    <div><label style="font-size:0.5rem; color:#aaa;">1Pl</label><input type="number" value="${st.rate1Player||15}" id="r1_${st.id}" style="width:100%; padding:5px;"></div>
                    <div><label style="font-size:0.5rem; color:#aaa;">2Pl</label><input type="number" value="${st.rate2Player||20}" id="r2_${st.id}" style="width:100%; padding:5px;"></div>
                    <div><label style="font-size:0.5rem; color:#aaa;">3Pl</label><input type="number" value="${st.rate3Player||25}" id="r3_${st.id}" style="width:100%; padding:5px;"></div>
                    <div><label style="font-size:0.5rem; color:#aaa;">4Pl</label><input type="number" value="${st.rate4Player||30}" id="r4_${st.id}" style="width:100%; padding:5px;"></div>
                    <button class="action-button small-btn" style="margin-top:auto;" onclick="updateRates(${st.id})">Save</button>
                </div>
            `).join('');

            // Inventory Form
            let inventoryHtml = inventoryData.map((item, i) => `
                <div class="admin-row" style="grid-template-columns: 1fr 1fr 1fr 60px auto; margin-bottom:5px;">
                    <input type="text" value="${item.name}" id="inv_name_${i}">
                    <input type="text" value="${item.category||'Food'}" id="inv_cat_${i}" placeholder="Category">
                    <input type="number" value="${item.price}" id="inv_price_${i}" step="1">
                    <div>
                        <label style="font-size:0.5rem; color:#aaa; display:block;">Shortcut</label>
                        <input type="checkbox" id="inv_short_${i}" ${item.isShortcut ? 'checked' : ''}>
                    </div>
                    <button class="action-button small-btn" onclick="updateInventory(${i})">Save</button>
                </div>
            `).join('');
            
            bodyField.innerHTML = `
                <div class="section-title" style="font-size: 0.9rem;">Station Hourly Rates (₹)</div>
                <div style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;">${stationsHtml}</div>

                <div class="section-title" style="margin-top: 20px; font-size: 0.9rem;">Menu Configurator</div>
                ${inventoryHtml}
                
                <div class="section-title" style="margin-top: 20px; font-size: 0.9rem;">Add Menu Item</div>
                <div class="admin-row" style="grid-template-columns: 1fr 1fr 1fr auto;">
                    <input type="text" id="new_item_name" placeholder="Name">
                    <input type="text" id="new_item_cat" placeholder="Category (e.g. Drinks)">
                    <input type="number" id="new_item_price" placeholder="Price">
                    <button class="action-button success-btn small-btn" onclick="addNewInventory()">Add</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function updateRates(id) {
            const st = stationsData.find(s => s.id === id);
            st.rate1Player = parseFloat(document.getElementById(`r1_${id}`).value) || 15;
            st.rate2Player = parseFloat(document.getElementById(`r2_${id}`).value) || 20;
            st.rate3Player = parseFloat(document.getElementById(`r3_${id}`).value) || 25;
            st.rate4Player = parseFloat(document.getElementById(`r4_${id}`).value) || 30;
            saveSystemData(); alert(`Rates for P${id} saved.`);
        }

        function updateInventory(i) {
            inventoryData[i].name = document.getElementById(`inv_name_${i}`).value;
            inventoryData[i].category = document.getElementById(`inv_cat_${i}`).value || 'Misc';
            inventoryData[i].price = parseFloat(document.getElementById(`inv_price_${i}`).value) || 0;
            inventoryData[i].isShortcut = document.getElementById(`inv_short_${i}`).checked;
            saveSystemData(); alert('Item updated.');
        }

        function addNewInventory() {
            const name = document.getElementById('new_item_name').value;
            const cat = document.getElementById('new_item_cat').value || 'Misc';
            const price = parseFloat(document.getElementById('new_item_price').value);
            if (name && !isNaN(price)) {
                inventoryData.push({ id: `inv_${Date.now()}`, name: name, category: cat, price: price, stock: 100, isShortcut: false });
                saveSystemData(); openAdminModal(); 
            }
        }

        // ==========================================
        // TICK ENGINE
        // ==========================================
        setInterval(() => {
            const now = new Date();
            stationsData.forEach(station => {
                if (station.status === 'IN_USE' && station.endTimestamp) {
                    station.timeRemaining = Math.max(0, Math.floor((station.endTimestamp - now) / 1000));
                    const gridTimer = document.getElementById(`grid-timer-${station.id}`);
                    if (gridTimer) gridTimer.textContent = formatTime(station.timeRemaining);
                    
                    if (targetedActiveStationId === station.id) {
                        const modalTimer = document.getElementById('modal-live-timer');
                        if (modalTimer) modalTimer.textContent = formatTime(station.timeRemaining);
                    }
                }
            });
        }, 1000);

        window.onload = checkLoginState;
    </script>
</body>
</html>
