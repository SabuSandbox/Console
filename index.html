    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow-x: hidden; background-color: #05010a; user-select: none; -webkit-user-select: none; }

        .hidden { display: none !important; }

        #galaxy-background {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; background-color: #06010f; 
            background-image: radial-gradient(circle at 15% 50%, rgba(70, 10, 130, 0.4) 0%, transparent 40%), radial-gradient(circle at 85% 20%, rgba(120, 0, 200, 0.25) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(40, 0, 80, 0.5) 0%, transparent 50%), radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 90px 40px, #e8d5ff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)), radial-gradient(1px 1px at 250px 150px, #d4aaff, rgba(0,0,0,0)), radial-gradient(2px 2px at 300px 50px, #ffffff, rgba(0,0,0,0)), radial-gradient(1px 1px at 350px 250px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 100% 100%, 100% 100%, 100% 100%, 250px 250px, 350px 350px, 400px 400px, 200px 200px, 450px 450px, 300px 300px;
            animation: drift 100s linear infinite;
        }

        @keyframes drift { 0% { background-position: 0% 0%, 0% 0%, 0% 0%, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px; } 100% { background-position: 0% 0%, 0% 0%, 0% 0%, -250px -250px, -350px -350px, -400px -400px, -200px -200px, -450px -450px, -300px -300px; } }
        #bg-logo-blur { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70vw; max-width: 800px; opacity: 0.12; filter: blur(15px); z-index: -1; pointer-events: none; }

        /* --- Login Screen --- */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: rgba(20, 5, 35, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(178, 0, 255, 0.3); border-radius: 30px; padding: 50px 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(138, 43, 226, 0.2); width: 100%; max-width: 400px; }
        .login-logo { width: 120px; filter: drop-shadow(0 0 20px rgba(178, 0, 255, 0.8)); margin-bottom: 5px; }
        .login-title { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; text-transform: uppercase; background: linear-gradient(90deg, #b200ff, #e066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(178,0,255,0.4); border-radius: 12px; padding: 12px; color: #fff; font-size: 1rem; text-align: center; outline: none; transition: 0.3s; }
        .login-input:focus { border-color: #e066ff; box-shadow: 0 0 10px rgba(224, 102, 255, 0.4); }

        /* --- Global & Glassmorphism --- */
        .glass-panel { background: rgba(20, 5, 35, 0.25); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.15); border-left: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(138, 43, 226, 0.15); }
        .dashboard-wrapper { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        
        .header-panel { border-radius: 40px; padding: 15px 40px; display: flex; justify-content: center; align-items: center; position: relative; z-index: 50; }
        .header-center { display: flex; align-items: center; gap: 20px; margin-left: -50px; }
        .logo-placeholder { width: 110px; height: 110px; display: flex; justify-content: center; align-items: center; }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(178, 0, 255, 0.6)); }
        .header-title { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin: 0; -webkit-text-stroke: 1px rgba(224, 102, 255, 0.6); background: linear-gradient(90deg, #b200ff, #5900ff, #e066ff, #ffffff, #e066ff, #5900ff, #b200ff); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 15px rgba(178, 0, 255, 0.5); animation: neonFlow 3s linear infinite; }
        .header-right { position: absolute; right: 40px; display: flex; align-items: center; }

        /* --- Dropdown Menu --- */
        .dropdown-container { position: relative; }
        .menu-btn { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 18px; border-radius: 12px; color: #fff; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .menu-btn:hover { background: rgba(138, 43, 226, 0.6); border-color: #e066ff; box-shadow: 0 0 20px rgba(138, 43, 226, 0.8); }
        .dropdown-content { display: none; position: absolute; right: 0; top: 130%; min-width: 240px; flex-direction: column; border-radius: 16px; overflow: hidden; z-index: 1000; border: 1px solid rgba(178, 0, 255, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .dropdown-content.show { display: flex; animation: fadeInDown 0.2s ease forwards; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .dropdown-item { padding: 16px 20px; cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.8rem; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; display: flex; align-items: center; gap: 10px; }

        .logout-item { color: #ff3333; } .logout-item:hover { background: rgba(255, 51, 51, 0.2); }

        /* --- Workspace & Cards --- */
        .main-content { border-radius: 40px; padding: 40px; display: flex; flex-direction: column; gap: 40px; position: relative; z-index: 10; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; color: #ffffff; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }

        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2); border-left: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 25px 20px; min-height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.03) translateY(-5px); background: rgba(178, 0, 255, 0.15); border-color: rgba(224, 102, 255, 0.5); box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4), inset 0 0 15px rgba(224, 102, 255, 0.2); }
        .card-header { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: auto; }
        .card-number { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; background: linear-gradient(180deg, #e066ff 0%, #8a2be2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 10px rgba(0,0,0,0.5); line-height: 1; }
        .card-status { font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-top: 5px; }
        .card-players { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(178, 0, 255, 0.3); padding: 5px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #e066ff; text-transform: uppercase; margin-top: 10px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-timer { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; margin: 10px 0; transition: color 0.3s ease; }

        .timer-safe { color: #00ff66; text-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
        .timer-warning { color: #ffae00; text-shadow: 0 0 15px rgba(255, 174, 0, 0.4); }
        .timer-critical { color: #ff3333; text-shadow: 0 0 20px rgba(255, 51, 51, 0.6); animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.4; } }

        /* --- Modals & Forms --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-container { border-radius: 24px; width: 90%; max-width: 600px; padding: 30px; max-height: 90vh; overflow-y: auto; transform: translateY(-20px); transition: 0.3s; }
        .modal-container::-webkit-scrollbar { width: 0; background: transparent; }
        .modal-overlay.active .modal-container { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
        .modal-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(to right, #b200ff, #e066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.6rem; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #ccc; }
        .form-group input, .form-group select { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { background: rgba(0, 0, 0, 0.6); border-color: #b200ff; box-shadow: 0 0 10px rgba(178, 0, 255, 0.4); }
        .form-group select option { background-color: #1a0b2e; color: #fff; }
        .nested-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; align-items: flex-end; }
        .admin-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px;}

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 16px; }
        .metric-item { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 0.85rem; font-weight: 700; color: #fff; }

        .history-list-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; max-height: 120px; overflow-y: auto; margin-bottom: 15px; padding: 10px; }
        .history-item { font-size: 0.8rem; display: flex; justify-content: space-between; padding: 6px 4px; color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .summary-total-strip { margin-top: 20px; padding-top: 15px; border-top: 1px dashed rgba(255, 255, 255, 0.2); display: flex; justify-content: space-between; align-items: center; }
        .total-label { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; color: #e066ff; }
        .total-price { font-size: 1.4rem; font-weight: 800; color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.3); }

        .action-button { width: 100%; background: linear-gradient(90deg, #5900ff, #b200ff); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px; color: white; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(89, 0, 255, 0.4); }
        .action-button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(178, 0, 255, 0.6); }
        .action-button.small-btn { padding: 10px; font-size: 0.8rem; margin-top: auto; border-radius: 8px; }
        .quick-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; flex: 1; }
        .quick-btn:hover { background: rgba(255,255,255,0.15); border-color:#e066ff; }
        .extra-time-btn { background: linear-gradient(90deg, #1e88e5, #42a5f5); box-shadow: 0 4px 15px rgba(30, 136, 229, 0.4); }
        .release-button { background: linear-gradient(90deg, #d32f2f, #f44336); box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); }
        .success-btn { background: linear-gradient(90deg, #00b347, #00ff66); color: #000; border: none; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4); }

        .log-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; margin-top: 10px;}
        .log-table th { background: rgba(0,0,0,0.3); color: #e066ff; padding: 12px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .log-table td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ddd; }

        @media (max-width: 850px) {
            body { padding: 10px; align-items: flex-start; }
            .header-panel { flex-direction: column; gap: 15px; padding: 20px; border-radius: 30px; }
            .header-right { position: absolute; top: 25px; right: 20px; }
            .header-title { font-size: 1.8rem; text-align: center; }
            .header-center { margin-left: 0; flex-direction: column; gap: 10px; }
            .logo-placeholder { width: 90px; height: 90px; }
            .main-content { padding: 25px; border-radius: 30px; gap: 30px; }
            .stations-grid { grid-template-columns: 1fr; gap: 20px; }
            .card { min-height: 200px; padding: 25px 20px; }
            .card-number { font-size: 4rem; }
            .card-timer { font-size: 2.8rem; }
            .metrics-grid { grid-template-columns: 1fr; } 
            .nested-row { grid-template-columns: 1fr; gap: 10px; } 
            #login-screen { padding: 15px; }
            .login-box { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <div id="galaxy-background"></div>
    <img src="wgz_prple_logo_2.png" id="bg-logo-blur" alt="">

    <!-- STAFF LOGIN OVERLAY -->
    <div id="login-screen" class="hidden">
        <div class="login-box glass-panel">
            <img src="wgz_prple_logo_2.png" class="login-logo" alt="Logo">
            <h2 class="login-title">STAFF LOGIN</h2>
            
            <input type="email" id="staff-email" class="login-input" placeholder="Staff Email Address">
            <input type="password" id="staff-password" class="login-input" placeholder="Password">
            <input type="text" id="location-id" class="login-input" placeholder="Location Code (e.g. Branch_1)">
            
            <button class="action-button" style="font-size:1.1rem; padding:15px; margin-top:20px;" onclick="handleLogin()">ACCESS SYSTEM</button>
            <p id="login-error" style="color:#ff3333; font-size:0.8rem; display:none; text-align:center;"></p>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div class="dashboard-wrapper hidden" id="main-app">
        <header class="header-panel glass-panel">
            <div class="header-center">
                <div class="logo-placeholder">
                    <img src="wgz_prple_logo_2.png" alt="Wonder Gamezone Logo">
                </div>
                <h1 class="header-title">Wonder Gamezone</h1>
            </div>
            <div class="header-right">
                <div class="dropdown-container">
                    <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
                    <div class="dropdown-content glass-panel" id="mainMenu">
                        <div class="dropdown-item" onclick="openAdminModal()">📦 Inventory & Admin</div>
                        <div class="dropdown-item" onclick="openSystemLogsModal()">📜 Session History</div>
                        <div class="dropdown-item" onclick="openMembershipModal()">💎 Membership Data</div>
                        <div class="dropdown-item logout-item" onclick="handleLogout()">🚪 Logout App</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content glass-panel">
            <div>
                <div class="section-title">🎮 Active Stations</div>
                <div class="stations-grid" id="in-use-grid"></div>
            </div>
            <div style="margin-top: 10px;">
                <div class="section-title">✅ Available Stations</div>
                <div class="stations-grid" id="available-grid"></div>
            </div>
        </main>
    </div>

    <!-- Universal Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay" onclick="hideActiveModal(event)">
        <div class="modal-container glass-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title-field">Control Terminal</h2>
                <button class="close-btn" onclick="closeTopModal()">&times;</button>
            </div>
            <div id="modal-injected-body"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION (MANDATORY)
        // ==========================================
        // You MUST replace these empty strings with your actual Firebase Project keys!
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDjLHWHnD02-pR7d6q5pWfsiD4H4_enIuQ",
  authDomain: "console-c1bd3.firebaseapp.com",
  projectId: "console-c1bd3",
  storageBucket: "console-c1bd3.firebasestorage.app",
  messagingSenderId: "422195108380",
  appId: "1:422195108380:web:9a92fcfe293c8eca8c5dd9",
  measurementId: "G-6C0BPQDW8G"
};

        let db, auth;
        let currentLocation = null; // Decides which branch data to load

        // Attempt to initialize Firebase only if keys are present
        try {
            if (firebaseConfig.apiKey !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            } else {
                console.warn("⚠️ Firebase is NOT configured. The app will run in local-only demo mode.");
            }
        } catch(e) { console.error("Firebase init error:", e); }

        // ==========================================
        // 2. GLOBAL STATE & DATA STRUCTURES
        // ==========================================
        let globalHourlyRate = 15.00;
        let isAdminAuthenticated = false;
        let targetedActiveStationId = null;
        let unsubscribeStations = null;
        let unsubscribeMembers = null;

        // Default Inventory (Syncs to Cloud)
        let inventoryData = [
            { id: 'inv_1', name: 'Classic Burger', price: 7.00, stock: 10 },
            { id: 'inv_2', name: 'Energy Soda', price: 3.00, stock: 20 },
            { id: 'inv_cig', name: 'Cigarette', price: 20.00, stock: 100 },
            { id: 'inv_drink', name: 'Cold Drink', price: 50.00, stock: 100 }
        ];

        let stationsData = Array.from({ length: 9 }, (_, idx) => ({
            id: idx + 1, status: 'AVAILABLE', timeRemaining: 0, durationMinutes: 0,
            startTimestamp: null, endTimestamp: null, playersCount: 1, playerNames: '',
            foodHistory: [], miscServiceFee: 0, extraTimeCost: 0, extraTimeAdded: 0
        }));

        let systemAuditLogs = [];
        let membersData = []; // Array of { id, name, phone, unpaidBalance }

        // ==========================================
        // 3. DATABASE SYNC & LOCAL FALLBACK
        // ==========================================
        function saveToCloud(collectionName, docId, data) {
            if (db && currentLocation) {
                db.collection('locations').doc(currentLocation).collection(collectionName).doc(docId.toString()).set(data, {merge: true}).catch(e => console.log(e));
            }
            // Always save to localStorage as a robust fallback
            localStorage.setItem(`wgz_${collectionName}`, JSON.stringify(data));
        }

        function pushLogToCloud(logEntry) {
            if (db && currentLocation) {
                db.collection('locations').doc(currentLocation).collection('logs').doc(logEntry.id).set(logEntry);
            }
            systemAuditLogs.unshift(logEntry);
            localStorage.setItem('wgz_logs', JSON.stringify(systemAuditLogs));
        }

        function bootCloudListeners() {
            if (!db || !currentLocation) return;
            
            // Listen to Stations
            if(unsubscribeStations) unsubscribeStations();
            unsubscribeStations = db.collection('locations').doc(currentLocation).collection('stations').onSnapshot(snap => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const idx = stationsData.findIndex(s => s.id === parseInt(doc.id));
                    if (idx !== -1) {
                        stationsData[idx] = { ...stationsData[idx], ...data };
                        // Convert Firestore Timestamps back to JS Dates for JS math
                        if(data.startTimestamp && data.startTimestamp.toDate) stationsData[idx].startTimestamp = data.startTimestamp.toDate();
                        if(data.endTimestamp && data.endTimestamp.toDate) stationsData[idx].endTimestamp = data.endTimestamp.toDate();
                    }
                });
                refreshDashboardVisuals();
            });

            // Listen to Members
            if(unsubscribeMembers) unsubscribeMembers();
            unsubscribeMembers = db.collection('locations').doc(currentLocation).collection('members').onSnapshot(snap => {
                membersData = [];
                snap.forEach(doc => membersData.push({ id: doc.id, ...doc.data() }));
            });
        }

        function loadLocalFallback() {
            const savedLogs = localStorage.getItem('wgz_logs');
            if (savedLogs) systemAuditLogs = JSON.parse(savedLogs);
            // In demo mode (no Firebase keys), we rely completely on localStorage.
            if(!db) refreshDashboardVisuals();
        }

        // ==========================================
        // 4. AUTHENTICATION (LOGIN / LOGOUT)
        // ==========================================
        function checkLoginState() {
            const storedLoc = sessionStorage.getItem('wgz_location');
            if (storedLoc) {
                currentLocation = storedLoc;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                bootCloudListeners();
                loadLocalFallback();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        }

        function handleLogin() {
            const email = document.getElementById('staff-email').value;
            const pass = document.getElementById('staff-password').value;
            const loc = document.getElementById('location-id').value || "Default_Branch";
            const errLabel = document.getElementById('login-error');

            if (!email || !pass || !loc) {
                errLabel.textContent = "Please fill all fields.";
                errLabel.style.display = 'block';
                return;
            }

            if (auth) {
                auth.signInWithEmailAndPassword(email, pass).then(() => {
                    sessionStorage.setItem('wgz_location', loc);
                    checkLoginState();
                }).catch(err => {
                    errLabel.textContent = "Error: " + err.message;
                    errLabel.style.display = 'block';
                });
            } else {
                // DEMO MODE: If Firebase isn't configured, fake login
                sessionStorage.setItem('wgz_location', loc);
                checkLoginState();
            }
        }

        function handleLogout() {
            if(auth) auth.signOut();
            sessionStorage.removeItem('wgz_location');
            isAdminAuthenticated = false;
            currentLocation = null;
            if(unsubscribeStations) unsubscribeStations();
            if(unsubscribeMembers) unsubscribeMembers();
            document.getElementById('mainMenu').classList.remove('show');
            checkLoginState();
        }

        // ==========================================
        // 5. CORE UI & TIMERS
        // ==========================================
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function notifySessionEnd(stationId) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            new Notification(`🎮 Session Ended!`, {
                body: `Time is up for Playstation P${stationId}. System is waiting for settlement.`,
                icon: 'wgz_prple_logo_2.png', badge: 'wgz_prple_logo_2.png', vibrate: [200, 100, 200]
            });
        }

        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function get12HourTime(dateObj) {
            if (!dateObj) return '--:--';
            let hours = dateObj.getHours(), minutes = dateObj.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function getTimerColorClass(secondsLeft, totalDurationSeconds) {
            if (secondsLeft <= 0) return 'timer-critical';
            const executionPercentage = (secondsLeft / totalDurationSeconds);
            if (executionPercentage <= 0.20) return 'timer-critical';
            if (executionPercentage <= 0.50) return 'timer-warning';
            return 'timer-safe';
        }

        function refreshDashboardVisuals() {
            const inUseGrid = document.getElementById('in-use-grid');
            const availableGrid = document.getElementById('available-grid');
            inUseGrid.innerHTML = ''; availableGrid.innerHTML = '';

            stationsData.forEach(station => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => launchStationConsole(station.id);

                if (station.status === 'IN_USE' || station.status === 'SETTLING') {
                    const colorStateClass = getTimerColorClass(station.timeRemaining, (station.durationMinutes + station.extraTimeAdded) * 60);
                    let displayNames = station.playerNames ? station.playerNames : `${station.playersCount} Player(s)`;
                    card.innerHTML = `
                        <div class="card-header"><div class="card-number">P${station.id}</div><div class="card-players">👥 ${displayNames}</div></div>
                        <div class="card-timer ${colorStateClass}" id="grid-timer-${station.id}">${formatTime(station.timeRemaining)}</div>
                        <button class="action-button small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🍕 Add Food / Manage</button>
                    `;
                    inUseGrid.appendChild(card);
                } else {
                    card.innerHTML = `
                        <div class="card-header"><div class="card-number" style="color: #666;">P${station.id}</div><div class="card-status">Available Space</div></div>
                        <button class="action-button success-btn small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🚀 Initialize Station</button>
                    `;
                    availableGrid.appendChild(card);
                }
            });
        }

        // ==========================================
        // 6. MODALS & STATION MANAGEMENT
        // ==========================================
        function launchStationConsole(stationId) {
            targetedActiveStationId = stationId;
            const station = stationsData.find(s => s.id === stationId);
            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');
            titleField.textContent = `Playstation P${station.id}`;

            if (station.status === 'AVAILABLE') {
                bodyField.innerHTML = `
                    <div class="form-group">
                        <label>Session Playing Duration</label>
                        <select id="setup-duration">
                            <option value="30">Half Hour (30 mins)</option><option value="60" selected>1 Hour (60 mins)</option>
                            <option value="90">1.5 Hours (90 mins)</option><option value="120">2 Hours (120 mins)</option>
                            <option value="300">5 Hours (300 mins)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Occupancy (Persons)</label>
                        <select id="setup-players"><option value="1">1 Person</option><option value="2">2 Persons</option><option value="3">3 Persons</option><option value="4">4 Persons</option></select>
                    </div>
                    <button class="action-button" onclick="commitNewSession()">Initialize Station</button>
                `;
            } else {
                renderActiveStationPanel(station);
            }
            document.getElementById('modal-overlay').classList.add('active');
        }

        function renderActiveStationPanel(station) {
            const bodyField = document.getElementById('modal-injected-body');
            let foodRowsHtml = station.foodHistory.length === 0 ? '<div class="history-item">No food items added yet.</div>' : station.foodHistory.map(f => `<div class="history-item"><span>${f.name} (x${f.qty})</span><span>₹${(f.price * f.qty).toFixed(2)}</span></div>`).join('');
            let inventoryOptions = inventoryData.filter(item => item.stock > 0).map(item => `<option value="${item.id}">${item.name} (₹${item.price.toFixed(2)}) - ${item.stock} left</option>`).join('');

            bodyField.innerHTML = `
                <div class="form-group"><input type="text" id="player-names-input" placeholder="Enter Player Names (Optional)..." value="${station.playerNames || ''}" onchange="updatePlayerNames(${station.id}, this.value)" style="border-color: rgba(178, 0, 255, 0.3);"></div>
                <div class="metrics-grid">
                    <div class="metric-item"><div class="metric-label">Start At</div><div class="metric-value">${get12HourTime(station.startTimestamp)}</div></div>
                    <div class="metric-item"><div class="metric-label">End By</div><div class="metric-value">${get12HourTime(station.endTimestamp)}</div></div>
                    <div class="metric-item"><div class="metric-label">Remaining Time</div><div class="metric-value" id="modal-live-timer" style="font-family:'Orbitron', sans-serif; color:${station.timeRemaining <= 0 ? '#ff3333' : '#00ff66'};">${formatTime(station.timeRemaining)}</div></div>
                    <div class="metric-item"><div class="metric-label">Occupants</div><div class="metric-value">${station.playersCount} Person(s)</div></div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom: 16px;">
                    <button class="action-button small-btn quick-btn" onclick="quickAddItem('Cigarette')">🚬 + Cigarette</button>
                    <button class="action-button small-btn quick-btn" onclick="quickAddItem('Cold Drink')">🥤 + Drink</button>
                </div>
                <div class="form-group"><label>Food Order History Ledger</label><div class="history-list-box">${foodRowsHtml}</div></div>
                <div class="form-group nested-row">
                    <div><label>Add Catering Add-on</label><select id="catering-select"><option value="none">-- Select Refreshment --</option>${inventoryOptions}</select></div>
                    <div><label>Quantity</label><input type="number" id="catering-qty" min="1" value="1"></div>
                    <button class="action-button" style="margin:0; padding:10px;" onclick="appendFoodToSession()">Add</button>
                </div>
                <div class="form-group"><label>Manual Misc Surcharge Fee (₹)</label><input type="number" id="surcharge-fee" min="0" value="${station.miscServiceFee}" oninput="recalculateLivePanelBill()"></div>
                <div style="display:flex; gap: 10px; margin-bottom: 10px;">
                    <button class="action-button extra-time-btn" onclick="addExtraTimeBlock()">+ 5 Mins (₹50)</button>
                    <button class="action-button" onclick="saveActivePanelState()">Save Changes</button>
                </div>
                <div class="summary-total-strip"><span class="total-label">Accrued Balance:</span><span class="total-price" id="panel-bill-display">₹0.00</span></div>
                <button class="action-button release-button" onclick="endSessionManually()">Settle & End Session</button>
            `;
            recalculateLivePanelBill();
        }

        function updatePlayerNames(stationId, val) {
            const station = stationsData.find(s => s.id === stationId);
            if(station) { station.playerNames = val; saveToCloud('stations', station.id, station); refreshDashboardVisuals(); }
        }

        function addExtraTimeBlock() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            station.extraTimeAdded += 5; station.extraTimeCost += 50.00;
            station.endTimestamp = new Date(station.endTimestamp.getTime() + 5 * 60000);
            station.timeRemaining = Math.max(0, Math.floor((station.endTimestamp - new Date()) / 1000));
            station.status = 'IN_USE'; 
            saveToCloud('stations', station.id, station);
            renderActiveStationPanel(station);
            refreshDashboardVisuals();
        }

        function closeTopModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            targetedActiveStationId = null;
        }

        function hideActiveModal(e) { if (e.target.id === 'modal-overlay') closeTopModal(); }

        function commitNewSession() {
            requestNotificationPermission(); 
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const duration = parseInt(document.getElementById('setup-duration').value) || 60;
            const now = new Date(); const end = new Date(now.getTime() + duration * 60000);

            station.status = 'IN_USE'; station.timeRemaining = duration * 60; station.durationMinutes = duration;
            station.playersCount = parseInt(document.getElementById('setup-players').value);
            station.playerNames = ''; station.startTimestamp = now; station.endTimestamp = end;
            station.foodHistory = []; station.miscServiceFee = 0; station.extraTimeCost = 0; station.extraTimeAdded = 0;

            saveToCloud('stations', station.id, station);
            refreshDashboardVisuals(); closeTopModal();
        }

        function quickAddItem(itemName) {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const inventoryItem = inventoryData.find(item => item.name === itemName);
            if (!inventoryItem) return alert("Item not found in inventory.");
            if (inventoryItem.stock <= 0) return alert("Insufficient stock!");

            inventoryItem.stock -= 1; 
            const matchingFoodItem = station.foodHistory.find(f => f.name === inventoryItem.name);
            if (matchingFoodItem) matchingFoodItem.qty += 1; else station.foodHistory.push({ id: inventoryItem.id, name: inventoryItem.name, price: inventoryItem.price, qty: 1 });

            saveToCloud('stations', station.id, station);
            renderActiveStationPanel(station);
        }

        function appendFoodToSession() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const invId = document.getElementById('catering-select').value;
            const qty = parseInt(document.getElementById('catering-qty').value) || 0;
            if (invId === 'none' || qty <= 0) return;

            const invItem = inventoryData.find(item => item.id === invId);
            if (!invItem) return;
            if (qty > invItem.stock) return alert("Insufficient stock!");

            invItem.stock -= qty;
            const match = station.foodHistory.find(f => f.name === invItem.name);
            if (match) match.qty += qty; else station.foodHistory.push({ id: invItem.id, name: invItem.name, price: invItem.price, qty: qty });

            saveToCloud('stations', station.id, station);
            renderActiveStationPanel(station);
        }

        function saveActivePanelState() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const sf = document.getElementById('surcharge-fee');
            if (sf) station.miscServiceFee = parseFloat(sf.value) || 0;
            saveToCloud('stations', station.id, station);
            closeTopModal();
        }

        function calculateTotalBalanceSheet(station) {
            const structuralPlayCost = (station.durationMinutes / 60) * globalHourlyRate;
            const cateringCostTotal = station.foodHistory.reduce((sum, item) => sum + (item.price * item.qty), 0);
            return { playCost: structuralPlayCost, foodCost: cateringCostTotal, miscCost: (parseFloat(station.miscServiceFee)||0), extraTime: (parseFloat(station.extraTimeCost)||0), grandTotal: structuralPlayCost + cateringCostTotal + (parseFloat(station.miscServiceFee)||0) + (parseFloat(station.extraTimeCost)||0) };
        }

        function recalculateLivePanelBill() {
            if (!targetedActiveStationId) return;
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const sf = document.getElementById('surcharge-fee');
            const statements = calculateTotalBalanceSheet({...station, miscServiceFee: sf ? parseFloat(sf.value) : station.miscServiceFee});
            document.getElementById('panel-bill-display').textContent = `₹${statements.grandTotal.toFixed(2)}`;
        }

        function endSessionManually() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            station.status = 'SETTLING';
            processSessionSettlement(station.id);
        }

        function processSessionSettlement(stationId) {
            if (!stationId) return;
            const station = stationsData.find(s => s.id === stationId);
            if (stationId === targetedActiveStationId) {
                const sf = document.getElementById('surcharge-fee');
                if (sf) station.miscServiceFee = parseFloat(sf.value) || 0;
            }

            const st = calculateTotalBalanceSheet(station);
            const logEntry = { id: 'LOG_' + Date.now(), stationId: station.id, duration: station.durationMinutes + station.extraTimeAdded, players: station.playersCount, playerNames: station.playerNames, foodHistory: JSON.parse(JSON.stringify(station.foodHistory)), statements: st, timestamp: new Date().toLocaleDateString() + ' ' + get12HourTime(new Date()) };
            
            pushLogToCloud(logEntry);
            renderBillReceipt(logEntry.id, true, station.id);
        }

        // --- Bill Receipt & Assign to Member ---
        function renderBillReceipt(logId, isImmediateSettlement, stationId = null) {
            const log = systemAuditLogs.find(l => l.id === logId);
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = `🧾 Bill - P${log.stationId}`;

            let itemsHtml = log.foodHistory.map(i => `<div class="invoice-line" style="font-size:0.85rem;"><span style="color:#ccc;">${i.name} <strong style="color:#e066ff;">(x${i.qty})</strong></span><span>₹${(i.price * i.qty).toFixed(2)}</span></div>`).join('');
            
            // Build Membership Dropdown for Billing
            let memberOpts = membersData.map(m => `<option value="${m.id}">${m.name} (Current Bal: ₹${m.unpaidBalance})</option>`).join('');
            let memberSelectHtml = isImmediateSettlement ? `
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <label style="font-size:0.7rem; color:#aaa; text-transform:uppercase;">Attach Bill To Member (Optional)</label>
                    <select id="bill-to-member" style="width:100%; background:rgba(0,0,0,0.6); color:#fff; padding:10px; border-radius:8px; border:1px solid #e066ff; margin-top:5px;">
                        <option value="none">-- Pay Now / Guest --</option>${memberOpts}
                    </select>
                </div>` : '';

            let actionBtn = isImmediateSettlement 
                ? `<button class="action-button success-btn" onclick="executeSettlement(${stationId}, '${logId}')">✅ Confirm & Clear Station</button>`
                : `<button class="action-button" onclick="openSystemLogsModal()">⬅ Back to History</button>`;

            bodyField.innerHTML = `
                <div class="invoice-block" style="text-align:left;">
                    ${log.playerNames ? `<div style="color:#00ff66; font-size:0.95rem; margin-bottom:15px; font-weight:bold; text-transform:uppercase;">👥 ${log.playerNames}</div>` : ''}
                    <div class="invoice-line" style="font-size:0.9rem; color:#fff; font-weight:bold;"><span>Session Play Time (${log.duration} Mins)</span><span>₹${log.statements.playCost.toFixed(2)}</span></div>
                    ${log.statements.extraTime > 0 ? `<div class="invoice-line" style="font-size:0.85rem; color:#ccc;"><span>Extra Time Surcharge</span><span>₹${log.statements.extraTime.toFixed(2)}</span></div>` : ''}
                    ${log.statements.miscCost > 0 ? `<div class="invoice-line" style="font-size:0.85rem; color:#ccc;"><span>Misc Surcharges</span><span>₹${log.statements.miscCost.toFixed(2)}</span></div>` : ''}
                    <div style="margin-top:15px; margin-bottom:5px; font-weight:bold; color:#b200ff; border-bottom:1px solid rgba(178,0,255,0.3); padding-bottom:5px;">Add-ons & Refreshments</div>
                    ${itemsHtml || '<div style="color:#666; font-size:0.8rem; font-style:italic;">No items ordered.</div>'}
                    <div class="summary-total-strip" style="margin-top:20px;"><span class="total-label">Grand Total</span><span class="total-price" style="font-size:1.8rem;">₹${log.statements.grandTotal.toFixed(2)}</span></div>
                    ${memberSelectHtml}
                    <div style="margin-top: 25px;">${actionBtn}</div>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function executeSettlement(stationId, logId) {
            const memSelect = document.getElementById('bill-to-member');
            if (memSelect && memSelect.value !== 'none') {
                const log = systemAuditLogs.find(l => l.id === logId);
                const memId = memSelect.value;
                if (db && currentLocation) {
                    // Update Firebase
                    db.collection('locations').doc(currentLocation).collection('members').doc(memId).update({
                        unpaidBalance: firebase.firestore.FieldValue.increment(log.statements.grandTotal)
                    });
                } else {
                    // Local Fallback
                    const mIdx = membersData.findIndex(m => m.id === memId);
                    if(mIdx > -1) { membersData[mIdx].unpaidBalance += log.statements.grandTotal; }
                }
                alert(`Bill of ₹${log.statements.grandTotal.toFixed(2)} has been assigned to member's account.`);
            }
            flushStationSlot(stationId);
        }

        function flushStationSlot(stationId) {
            const station = stationsData.find(s => s.id === stationId);
            station.status = 'AVAILABLE'; station.timeRemaining = 0; station.startTimestamp = null; station.endTimestamp = null;
            station.playerNames = ''; station.foodHistory = []; station.miscServiceFee = 0; station.extraTimeCost = 0; station.extraTimeAdded = 0;
            saveToCloud('stations', station.id, station);
            refreshDashboardVisuals(); closeTopModal();
        }

        // ==========================================
        // 7. MENU TABS (ADMIN, HISTORY, MEMBERS)
        // ==========================================

        function openSystemLogsModal() {

        // --- NEW MEMBERSHIP MASTER DATA TAB ---
        function openMembershipModal() {
            document.getElementById('mainMenu').classList.remove('show');
            const bodyField = document.getElementById('modal-injected-body');
            document.getElementById('modal-title-field').textContent = "💎 Membership Ledger";

            let rows = membersData.length === 0 ? `<tr><td colspan="4" style="text-align:center; color:#888;">No members registered yet.</td></tr>` : membersData.map(m => `
                <tr>
                    <td style="font-weight:bold; color:#fff;">${m.name}</td>
                    <td>${m.phone}</td>
                    <td style="color:${m.unpaidBalance > 0 ? '#ff3333' : '#00ff66'}; font-weight:bold;">₹${m.unpaidBalance.toFixed(2)}</td>
                    <td><button class="action-button small-btn success-btn" style="padding: 4px 8px; margin:0;" onclick="payMemberBalance('${m.id}')">Settle</button></td>
                </tr>
            `).join('');

            bodyField.innerHTML = `
                <div class="section-title" style="font-size: 0.9rem;">Register New Member</div>
                <div class="admin-row" style="margin-bottom: 25px;">
                    <input type="text" id="new_mem_name" placeholder="Member Name">
                    <input type="text" id="new_mem_phone" placeholder="Phone (Optional)">
                    <button class="action-button" style="margin:0; padding:10px 15px; grid-column: span 2;" onclick="registerNewMember()">Register</button>
                </div>
                <div class="section-title" style="font-size: 0.9rem;">Registered Members</div>
                <div class="log-table-wrapper">
                    <table class="log-table">
                        <thead><tr><th>Name</th><th>Contact</th><th>Unpaid Balance</th><th>Action</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function registerNewMember() {
            const name = document.getElementById('new_mem_name').value;
            const phone = document.getElementById('new_mem_phone').value;
            if(!name) return alert("Member name is required.");
            
            const newMem = { name: name, phone: phone || 'N/A', unpaidBalance: 0 };
            
            if (db && currentLocation) {
                db.collection('locations').doc(currentLocation).collection('members').add(newMem).then(() => {
                    openMembershipModal();
                });
            } else {
                newMem.id = 'MEM_' + Date.now();
                membersData.push(newMem);
                openMembershipModal();
            }
        }

        function payMemberBalance(memId) {
            const mem = membersData.find(m => m.id === memId);
            if(mem.unpaidBalance <= 0) return alert("Balance is already clear.");
            const amt = prompt(`Enter amount to pay for ${mem.name} (Current debt: ₹${mem.unpaidBalance})`, mem.unpaidBalance);
            if(amt && !isNaN(amt)) {
                if (db && currentLocation) {
                    db.collection('locations').doc(currentLocation).collection('members').doc(memId).update({
                        unpaidBalance: firebase.firestore.FieldValue.increment(-parseFloat(amt))
                    }).then(() => openMembershipModal());
                } else {
                    mem.unpaidBalance -= parseFloat(amt);
                    openMembershipModal();
                }
            }
        }

        // ==========================================
        // 8. TICK ENGINE (Resilient to Refreshes)
        // ==========================================
        setInterval(() => {
            const now = new Date();
            stationsData.forEach(station => {
                if (station.status === 'IN_USE' && station.endTimestamp) {
                    // Absolute Time Calculation - Immune to page refreshes
                    const diffSeconds = Math.floor((station.endTimestamp - now) / 1000);
                    station.timeRemaining = Math.max(0, diffSeconds);

                    const gridTimer = document.getElementById(`grid-timer-${station.id}`);
                    if (gridTimer) {
                        gridTimer.textContent = formatTime(station.timeRemaining);
                        gridTimer.className = `card-timer ${getTimerColorClass(station.timeRemaining, (station.durationMinutes + station.extraTimeAdded) * 60)}`;
                    }

                    if (targetedActiveStationId === station.id) {
                        const modalTimer = document.getElementById('modal-live-timer');
                        if (modalTimer) {
                            modalTimer.textContent = formatTime(station.timeRemaining);
                            modalTimer.style.color = station.timeRemaining <= 0 ? '#ff3333' : '#00ff66';
                        }
                    }

                    if (station.timeRemaining <= 0) {
                        notifySessionEnd(station.id);
                        station.status = 'SETTLING';
                        saveToCloud('stations', station.id, station);
                        processSessionSettlement(station.id);
                    }
                }
            });
        }, 1000);

        // Boot
        window.onload = checkLoginState;
    </script>
</body>
</html>
