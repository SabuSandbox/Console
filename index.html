<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wonder Gamezone - Administration</title>
    
    <!-- === Web App & PWA Meta Tags === -->
    <meta name="theme-color" content="#06010f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wonder GZ">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="wgz_prple_logo_2.png">
    <link rel="icon" type="image/png" href="wgz_prple_logo_2.png">
    
    <!-- Inline Manifest for "Add to Home Screen" capability -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Wonder Gamezone Admin","short_name":"Wonder GZ","start_url":".","display":"standalone","background_color":"#06010f","theme_color":"#06010f","icons":[{"src":"wgz_prple_logo_2.png","sizes":"192x192","type":"image/png"},{"src":"wgz_prple_logo_2.png","sizes":"512x512","type":"image/png"}]}'>
    
    <!-- Epic Sci-Fi Gaming Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- Core Reset & App Feel --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
            background-color: #05010a;
            user-select: none; 
            -webkit-user-select: none;
        }

        input, select, textarea {
            user-select: auto;
            -webkit-user-select: auto;
        }

        .hidden { display: none !important; }

        /* --- Animated Galaxy & Background Elements --- */
        #galaxy-background {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
            background-color: #06010f; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(70, 10, 130, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(120, 0, 200, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(40, 0, 80, 0.5) 0%, transparent 50%),
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #e8d5ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 250px 150px, #d4aaff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 50px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 350px 250px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 100% 100%, 100% 100%, 100% 100%, 250px 250px, 350px 350px, 400px 400px, 200px 200px, 450px 450px, 300px 300px;
            animation: drift 100s linear infinite;
        }

        @keyframes drift {
            0% { background-position: 0% 0%, 0% 0%, 0% 0%, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px; }
            100% { background-position: 0% 0%, 0% 0%, 0% 0%, -250px -250px, -350px -350px, -400px -400px, -200px -200px, -450px -450px, -300px -300px; }
        }

        #bg-logo-blur {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            max-width: 800px;
            opacity: 0.12;
            filter: blur(15px);
            z-index: -1;
            pointer-events: none;
        }

        /* --- Login Screen --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: rgba(20, 5, 35, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(178, 0, 255, 0.3);
            border-radius: 30px;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(138, 43, 226, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            width: 140px;
            filter: drop-shadow(0 0 20px rgba(178, 0, 255, 0.8));
            margin-bottom: 10px;
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #b200ff, #e066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .pin-input {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(178,0,255,0.4);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            border-color: #e066ff;
            box-shadow: 0 0 15px rgba(224, 102, 255, 0.4);
        }

        /* --- Glassmorphism Base Class --- */
        .glass-panel {
            background: rgba(20, 5, 35, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            border-left: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(138, 43, 226, 0.15);
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 50px;
        }

        /* --- Global Header Space --- */
        .header-panel {
            border-radius: 40px;
            padding: 15px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 50; 
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: -50px; 
        }

        .logo-placeholder {
            width: 110px; 
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(178, 0, 255, 0.6));
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            -webkit-text-stroke: 1px rgba(224, 102, 255, 0.6);
            background: linear-gradient(90deg, #b200ff, #5900ff, #e066ff, #ffffff, #e066ff, #5900ff, #b200ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(178, 0, 255, 0.5);
            animation: neonFlow 3s linear infinite;
        }

        @keyframes neonFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .header-right {
            position: absolute;
            right: 40px;
            display: flex;
            align-items: center;
        }

        /* --- Dropdown Menu System --- */
        .dropdown-container { position: relative; }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background: rgba(138, 43, 226, 0.6);
            border-color: #e066ff;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 130%;
            min-width: 240px;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid rgba(178, 0, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .dropdown-content.show {
            display: flex;
            animation: fadeInDown 0.2s ease forwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:hover {
            background: rgba(178, 0, 255, 0.4);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .logout-item { color: #ff3333; }
        .logout-item:hover { background: rgba(255, 51, 51, 0.2); text-shadow: none; }

        /* --- Workspace Configurations --- */
        .main-content {
            border-radius: 40px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
            z-index: 10;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: rgba(178, 0, 255, 0.4);
        }

        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* --- Interactive System Cards --- */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px 20px; 
            min-height: 240px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: scale(1.03) translateY(-5px);
            background: rgba(178, 0, 255, 0.15);
            border-color: rgba(224, 102, 255, 0.5);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4), inset 0 0 15px rgba(224, 102, 255, 0.2);
        }

        .card-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: auto;
        }

        .card-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #e066ff 0%, #8a2be2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            line-height: 1;
        }

        .card-status {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaa;
            margin-top: 5px;
        }

        .card-players {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(178, 0, 255, 0.3);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #e066ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 10px 0;
            transition: color 0.3s ease;
        }

        .timer-safe { color: #00ff66; text-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
        .timer-warning { color: #ffae00; text-shadow: 0 0 15px rgba(255, 174, 0, 0.4); }
        .timer-critical { color: #ff3333; text-shadow: 0 0 20px rgba(255, 51, 51, 0.6); animation: blinker 1s linear infinite; }

        @keyframes blinker { 50% { opacity: 0.4; } }

        /* --- Modal & System Components --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-container {
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(-20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-container::-webkit-scrollbar { width: 0; background: transparent; }

        .modal-overlay.active .modal-container { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .modal-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(to right, #b200ff, #e066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-btn { background: none; border: none; color: #aaa; font-size: 1.6rem; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #ccc; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .form-group input, .form-group select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus { 
            background: rgba(0, 0, 0, 0.6);
            border-color: #b200ff; 
            box-shadow: 0 0 10px rgba(178, 0, 255, 0.4); 
        }
        
        .form-group select option { background-color: #1a0b2e; color: #fff; }

        .nested-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; align-items: flex-end; }
        .admin-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px;}

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
        }

        .metric-item { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 0.85rem; font-weight: 700; color: #fff; word-break: break-all; }

        .history-list-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
        }

        .history-item {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            padding: 6px 4px;
            color: #ddd;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .summary-total-strip {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; color: #e066ff; }
        .total-price { font-size: 1.4rem; font-weight: 800; color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.3); }

        .action-button {
            width: 100%;
            background: linear-gradient(90deg, #5900ff, #b200ff);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(89, 0, 255, 0.4);
        }
        
        .action-button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(178, 0, 255, 0.6); 
        }

        .action-button.small-btn {
            padding: 10px;
            font-size: 0.8rem;
            margin-top: auto;
            border-radius: 8px;
        }

        .quick-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: none;
            flex: 1;
        }
        .quick-btn:hover { background: rgba(255,255,255,0.15); border-color:#e066ff; }

        .extra-time-btn { background: linear-gradient(90deg, #1e88e5, #42a5f5); box-shadow: 0 4px 15px rgba(30, 136, 229, 0.4); }
        .release-button { background: linear-gradient(90deg, #d32f2f, #f44336); box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4); }
        .success-btn { background: linear-gradient(90deg, #00b347, #00ff66); color: #000; border: none; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4); }

        .invoice-block { text-align: center; padding: 10px 0; }
        .invoice-line { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.9rem; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding-bottom: 5px; }

        .log-table-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; }
        .log-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; }
        .log-table th { background: rgba(0,0,0,0.3); color: #e066ff; padding: 12px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .log-table td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ddd; }

        /* --- Heavy Mobile App Optimizations --- */
        @media (max-width: 850px) {
            body { padding: 10px; align-items: flex-start; }
            .header-panel { flex-direction: column; gap: 15px; padding: 20px; border-radius: 30px; }
            .header-right { position: absolute; top: 25px; right: 20px; }
            .header-title { font-size: 1.8rem; text-align: center; }
            .header-center { margin-left: 0; flex-direction: column; gap: 10px; }
            .logo-placeholder { width: 90px; height: 90px; }
            
            .main-content { padding: 25px; border-radius: 30px; gap: 30px; }
            .stations-grid { grid-template-columns: 1fr; gap: 20px; }
            .card { min-height: 200px; padding: 25px 20px; }
            .card-number { font-size: 4rem; }
            .card-timer { font-size: 2.8rem; }
            
            .metrics-grid { grid-template-columns: 1fr; } 
            .nested-row { grid-template-columns: 1fr; gap: 10px; } 
            
            #login-screen { padding: 15px; }
            .login-box { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <!-- CSS Galaxy Background Layer -->
    <div id="galaxy-background"></div>
    <img src="wgz_prple_logo_2.png" id="bg-logo-blur" alt="">

    <!-- STAFF LOGIN OVERLAY -->
    <div id="login-screen" class="hidden">
        <div class="login-box glass-panel">
            <img src="wgz_prple_logo_2.png" class="login-logo" alt="Logo">
            <h2 class="login-title">STAFF LOGIN</h2>
            <p style="color:#aaa; font-size:0.8rem; margin-top:-15px;">Authorized Personnel Only</p>
            <input type="password" id="staff-pin-input" class="pin-input" placeholder="****" maxlength="4">
            <button class="action-button" style="font-size:1.1rem; padding:15px;" onclick="handleLogin()">ACCESS SYSTEM</button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div class="dashboard-wrapper hidden" id="main-app">
        <header class="header-panel glass-panel">
            <div class="header-center">
                <div class="logo-placeholder">
                    <img src="wgz_prple_logo_2.png" alt="Wonder Gamezone Logo">
                </div>
                <h1 class="header-title">Wonder Gamezone</h1>
            </div>
            <div class="header-right">
                <div class="dropdown-container">
                    <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
                    <!-- Dropdown List -->
                    <div class="dropdown-content glass-panel" id="mainMenu">
                        <div class="dropdown-item" onclick="openAdminModal()">📦 Inventory & Admin</div>
                        <div class="dropdown-item" onclick="openSystemLogsModal()">📜 Session History</div>
                        <div class="dropdown-item" onclick="openMembershipModal()">💎 Membership</div>
                        <div class="dropdown-item logout-item" onclick="handleLogout()">🚪 Logout App</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content glass-panel">
            <div>
                <div class="section-title">🎮 Active Stations</div>
                <div class="stations-grid" id="in-use-grid"></div>
            </div>
            <div style="margin-top: 10px;">
                <div class="section-title">✅ Available Stations</div>
                <div class="stations-grid" id="available-grid"></div>
            </div>
        </main>
    </div>

    <!-- Universal Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay" onclick="hideActiveModal(event)">
        <div class="modal-container glass-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title-field">Control Terminal</h2>
                <button class="close-btn" onclick="closeTopModal()">&times;</button>
            </div>
            <div id="modal-injected-body"></div>
        </div>
    </div>

    <script>
        // --- SYSTEM CONFIGURATION ---
        const VALID_STAFF_PIN = "1234"; // CHANGE THIS PIN FOR YOUR STAFF
        const VALID_ADMIN_PASSWORD = "admin"; // CHANGE THIS PASSWORD FOR YOUR ADMIN DASHBOARD

        let globalHourlyRate = 15.00;
        let isAdminAuthenticated = false;

        // Base Data Structures
        let inventoryData = [
            { id: 'inv_1', name: 'Classic Burger', price: 7.00, stock: 10 },
            { id: 'inv_2', name: 'Energy Soda', price: 3.00, stock: 20 },
            { id: 'inv_3', name: 'Salted Fries', price: 5.00, stock: 15 },
            { id: 'inv_cig', name: 'Cigarette', price: 20.00, stock: 100 },
            { id: 'inv_drink', name: 'Cold Drink', price: 50.00, stock: 100 }
        ];

        let stationsData = Array.from({ length: 9 }, (_, idx) => ({
            id: idx + 1,
            status: 'AVAILABLE',
            timeRemaining: 0,
            durationMinutes: 0,
            startTimestamp: null,
            endTimestamp: null,
            playersCount: 1,
            playerNames: '',
            foodHistory: [], 
            miscServiceFee: 0,
            extraTimeCost: 0,
            extraTimeAdded: 0
        }));

        let systemAuditLogs = [];
        let targetedActiveStationId = null;

        // --- LOCAL STORAGE PERSISTENCE (SAVE & LOAD) ---
        function saveSystemData() {
            localStorage.setItem('wgz_stations', JSON.stringify(stationsData));
            localStorage.setItem('wgz_logs', JSON.stringify(systemAuditLogs));
            localStorage.setItem('wgz_inventory', JSON.stringify(inventoryData));
            localStorage.setItem('wgz_hourly_rate', globalHourlyRate.toString());
        }

        function loadSystemData() {
            const savedStations = localStorage.getItem('wgz_stations');
            if (savedStations) {
                let parsed = JSON.parse(savedStations);
                // Carefully restore Date objects from JSON strings
                for (let i = 0; i < stationsData.length; i++) {
                    if (parsed[i]) {
                        Object.assign(stationsData[i], parsed[i]);
                        if (parsed[i].startTimestamp) stationsData[i].startTimestamp = new Date(parsed[i].startTimestamp);
                        if (parsed[i].endTimestamp) stationsData[i].endTimestamp = new Date(parsed[i].endTimestamp);
                    }
                }
            }

            const savedLogs = localStorage.getItem('wgz_logs');
            if (savedLogs) systemAuditLogs = JSON.parse(savedLogs);

            const savedInv = localStorage.getItem('wgz_inventory');
            if (savedInv) inventoryData = JSON.parse(savedInv);

            const savedRate = localStorage.getItem('wgz_hourly_rate');
            if (savedRate) globalHourlyRate = parseFloat(savedRate);
        }

        // --- LOGIN AUTHENTICATION SYSTEM ---
        function checkLoginState() {
            loadSystemData(); // Always load data on boot
            if (sessionStorage.getItem('wgz_isLoggedIn') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                refreshDashboardVisuals();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        }

        function handleLogin() {
            const pin = document.getElementById('staff-pin-input').value;
            if (pin === VALID_STAFF_PIN || pin === VALID_ADMIN_PASSWORD) {
                sessionStorage.setItem('wgz_isLoggedIn', 'true');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                refreshDashboardVisuals();
            } else {
                alert("Access Denied: Invalid PIN.");
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('wgz_isLoggedIn');
            isAdminAuthenticated = false;
            document.getElementById('staff-pin-input').value = '';
            document.getElementById('mainMenu').classList.remove('show');
            checkLoginState();
        }

        // --- App Push Notifications System ---
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function notifySessionEnd(stationId) {
            if (!("Notification" in window)) return;
            const title = `🎮 Session Ended!`;
            const options = {
                body: `Time is up for Playstation P${stationId}. System is waiting for settlement.`,
                icon: 'wgz_prple_logo_2.png',
                badge: 'wgz_prple_logo_2.png',
                vibrate: [200, 100, 200, 100, 200]
            };
            if (Notification.permission === "granted") {
                new Notification(title, options);
            }
        }

        // --- Dropdown Menu Logic ---
        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('mainMenu').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }

        // --- Core Formatting ---
        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function get12HourTime(dateObj) {
            if (!dateObj) return '--:--';
            let hours = dateObj.getHours();
            let minutes = dateObj.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function getTimerColorClass(secondsLeft, totalDurationSeconds) {
            if (secondsLeft <= 0) return 'timer-critical';
            const executionPercentage = (secondsLeft / totalDurationSeconds);
            if (executionPercentage <= 0.20) return 'timer-critical';
            if (executionPercentage <= 0.50) return 'timer-warning';
            return 'timer-safe';
        }

        // --- Grid Rendering ---
        function refreshDashboardVisuals() {
            const inUseGrid = document.getElementById('in-use-grid');
            const availableGrid = document.getElementById('available-grid');
            inUseGrid.innerHTML = '';
            availableGrid.innerHTML = '';

            stationsData.forEach(station => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => launchStationConsole(station.id);

                if (station.status === 'IN_USE' || station.status === 'SETTLING') {
                    const colorStateClass = getTimerColorClass(station.timeRemaining, (station.durationMinutes + station.extraTimeAdded) * 60);
                    let displayNames = station.playerNames ? station.playerNames : `${station.playersCount} Player(s)`;
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-number">P${station.id}</div>
                            <div class="card-players">👥 ${displayNames}</div>
                        </div>
                        <div class="card-timer ${colorStateClass}" id="grid-timer-${station.id}">${formatTime(station.timeRemaining)}</div>
                        <button class="action-button small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🍕 Add Food / Manage</button>
                    `;
                    inUseGrid.appendChild(card);
                } else if (station.status === 'AVAILABLE') {
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-number" style="color: #666;">P${station.id}</div>
                            <div class="card-status">Available Space</div>
                        </div>
                        <button class="action-button success-btn small-btn" onclick="event.stopPropagation(); launchStationConsole(${station.id})">🚀 Initialize Station</button>
                    `;
                    availableGrid.appendChild(card);
                }
            });
        }

        // --- Station Management Modals ---
        function launchStationConsole(stationId) {
            targetedActiveStationId = stationId;
            const station = stationsData.find(s => s.id === stationId);
            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');

            titleField.textContent = `Playstation P${station.id}`;

            if (station.status === 'AVAILABLE') {
                bodyField.innerHTML = `
                    <div class="form-group">
                        <label>Session Playing Duration</label>
                        <select id="setup-duration">
                            <option value="30">Half Hour (30 mins)</option>
                            <option value="60" selected>1 Hour (60 mins)</option>
                            <option value="90">1.5 Hours (90 mins)</option>
                            <option value="120">2 Hours (120 mins)</option>
                            <option value="150">2.5 Hours (150 mins)</option>
                            <option value="180">3 Hours (180 mins)</option>
                            <option value="210">3.5 Hours (210 mins)</option>
                            <option value="240">4 Hours (240 mins)</option>
                            <option value="300">5 Hours (300 mins)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Occupancy Count (Persons)</label>
                        <select id="setup-players">
                            <option value="1">1 Person</option>
                            <option value="2">2 Persons</option>
                            <option value="3">3 Persons</option>
                            <option value="4">4 Persons</option>
                        </select>
                    </div>
                    <button class="action-button" onclick="commitNewSession()">Initialize Station</button>
                `;
            } else {
                renderActiveStationPanel(station);
            }
            document.getElementById('modal-overlay').classList.add('active');
        }

        function renderActiveStationPanel(station) {
            const bodyField = document.getElementById('modal-injected-body');
            
            let foodRowsHtml = station.foodHistory.length === 0 
                ? '<div class="history-item">No food items added yet.</div>'
                : station.foodHistory.map(f => `<div class="history-item"><span>${f.name} (x${f.qty})</span><span>₹${(f.price * f.qty).toFixed(2)}</span></div>`).join('');

            let inventoryOptions = inventoryData.filter(item => item.stock > 0).map(item => 
                `<option value="${item.id}">${item.name} (₹${item.price.toFixed(2)}) - ${item.stock} left</option>`
            ).join('');

            bodyField.innerHTML = `
                <div class="form-group">
                    <input type="text" id="player-names-input" placeholder="Enter Player Names (Optional)..." value="${station.playerNames || ''}" onchange="updatePlayerNames(${station.id}, this.value)" style="border-color: rgba(178, 0, 255, 0.3);">
                </div>

                <div class="metrics-grid">
                    <div class="metric-item"><div class="metric-label">Start At</div><div class="metric-value">${get12HourTime(station.startTimestamp)}</div></div>
                    <div class="metric-item"><div class="metric-label">End By</div><div class="metric-value">${get12HourTime(station.endTimestamp)}</div></div>
                    <div class="metric-item"><div class="metric-label">Remaining Time</div><div class="metric-value" id="modal-live-timer" style="font-family:'Orbitron', sans-serif; color:${station.timeRemaining <= 0 ? '#ff3333' : '#00ff66'};">${formatTime(station.timeRemaining)}</div></div>
                    <div class="metric-item"><div class="metric-label">Occupants</div><div class="metric-value">${station.playersCount} Person(s)</div></div>
                </div>

                <!-- Quick Action Buttons -->
                <div style="display:flex; gap:10px; margin-bottom: 16px;">
                    <button class="action-button small-btn quick-btn" onclick="quickAddItem('Cigarette')">🚬 + Cigarette</button>
                    <button class="action-button small-btn quick-btn" onclick="quickAddItem('Cold Drink')">🥤 + Drink</button>
                </div>

                <div class="form-group"><label>Food Order History Ledger</label><div class="history-list-box">${foodRowsHtml}</div></div>

                <div class="form-group nested-row">
                    <div>
                        <label>Add Catering Add-on</label>
                        <select id="catering-select">
                            <option value="none">-- Select Refreshment --</option>
                            ${inventoryOptions}
                        </select>
                    </div>
                    <div>
                        <label>Quantity</label>
                        <input type="number" id="catering-qty" min="1" value="1">
                    </div>
                    <button class="action-button" style="margin:0; padding:10px;" onclick="appendFoodToSession()">Add</button>
                </div>

                <div class="form-group">
                    <label>Manual Misc Surcharge Fee (₹)</label>
                    <input type="number" id="surcharge-fee" min="0" value="${station.miscServiceFee}" oninput="recalculateLivePanelBill()">
                </div>

                <div style="display:flex; gap: 10px; margin-bottom: 10px;">
                    <button class="action-button extra-time-btn" onclick="addExtraTimeBlock()">+ 5 Mins (₹50)</button>
                    <button class="action-button" onclick="saveActivePanelState()">Save Changes</button>
                </div>

                <div class="summary-total-strip">
                    <span class="total-label">Accrued Balance:</span>
                    <span class="total-price" id="panel-bill-display">₹0.00</span>
                </div>

                <button class="action-button release-button" onclick="endSessionManually()">Settle & End Session</button>
            `;
            recalculateLivePanelBill();
        }

        // --- Core Application Logic & State Saving ---
        function updatePlayerNames(stationId, val) {
            const station = stationsData.find(s => s.id === stationId);
            if(station) { station.playerNames = val; saveSystemData(); refreshDashboardVisuals(); }
        }

        function addExtraTimeBlock() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            station.extraTimeAdded += 5;
            station.extraTimeCost += 50.00;
            station.endTimestamp = new Date(station.endTimestamp.getTime() + 5 * 60000); // Add 5 mins to End Time
            // Force recalculate remaining time instantly
            const diffSeconds = Math.floor((station.endTimestamp - new Date()) / 1000);
            station.timeRemaining = Math.max(0, diffSeconds);
            station.status = 'IN_USE'; // Resume if it was settling
            
            saveSystemData();
            renderActiveStationPanel(station);
            refreshDashboardVisuals();
        }

        function closeTopModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            targetedActiveStationId = null;
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove('show');
            }
        }

        function hideActiveModal(e) { if (e.target.id === 'modal-overlay') closeTopModal(); }

        function commitNewSession() {
            requestNotificationPermission(); // Request push notifications on first use
            
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const duration = parseInt(document.getElementById('setup-duration').value) || 60;
            const players = parseInt(document.getElementById('setup-players').value);

            const now = new Date();
            const end = new Date(now.getTime() + duration * 60000);

            station.status = 'IN_USE';
            station.timeRemaining = duration * 60;
            station.durationMinutes = duration;
            station.playersCount = players;
            station.playerNames = '';
            station.startTimestamp = now;
            station.endTimestamp = end;
            
            station.foodHistory = [];
            station.miscServiceFee = 0;
            station.extraTimeCost = 0;
            station.extraTimeAdded = 0;

            saveSystemData();
            refreshDashboardVisuals();
            closeTopModal();
        }

        function quickAddItem(itemName) {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const inventoryItem = inventoryData.find(item => item.name === itemName);
            
            if (!inventoryItem) {
                alert(itemName + " not found in system inventory. Please add it via Admin panel.");
                return;
            }
            if (inventoryItem.stock <= 0) {
                alert(`Insufficient stock for ${itemName}!`);
                return;
            }

            inventoryItem.stock -= 1; // Reduce global stock
            const matchingFoodItem = station.foodHistory.find(f => f.name === inventoryItem.name);
            if (matchingFoodItem) { matchingFoodItem.qty += 1; } 
            else { station.foodHistory.push({ id: inventoryItem.id, name: inventoryItem.name, price: inventoryItem.price, qty: 1 }); }

            saveSystemData();
            renderActiveStationPanel(station);
        }

        function appendFoodToSession() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const invId = document.getElementById('catering-select').value;
            const quantity = parseInt(document.getElementById('catering-qty').value) || 0;

            if (invId === 'none' || quantity <= 0) return;

            const inventoryItem = inventoryData.find(item => item.id === invId);
            if (!inventoryItem) return;

            if (quantity > inventoryItem.stock) {
                alert(`Insufficient stock! Only ${inventoryItem.stock} left.`);
                return;
            }

            inventoryItem.stock -= quantity;
            const matchingFoodItem = station.foodHistory.find(f => f.name === inventoryItem.name);
            if (matchingFoodItem) { matchingFoodItem.qty += quantity; } 
            else { station.foodHistory.push({ id: inventoryItem.id, name: inventoryItem.name, price: inventoryItem.price, qty: quantity }); }

            saveSystemData();
            renderActiveStationPanel(station);
        }

        function saveActivePanelState() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const surchargeField = document.getElementById('surcharge-fee');
            if (surchargeField) {
                station.miscServiceFee = parseFloat(surchargeField.value) || 0;
            }
            saveSystemData();
            closeTopModal();
        }

        function calculateTotalBalanceSheet(station) {
            const structuralPlayCost = (station.durationMinutes / 60) * globalHourlyRate;
            const cateringCostTotal = station.foodHistory.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const manualFees = parseFloat(station.miscServiceFee) || 0;
            const extraTimeTotal = parseFloat(station.extraTimeCost) || 0;
            
            return {
                playCost: structuralPlayCost,
                foodCost: cateringCostTotal,
                miscCost: manualFees,
                extraTime: extraTimeTotal,
                grandTotal: structuralPlayCost + cateringCostTotal + manualFees + extraTimeTotal
            };
        }

        function recalculateLivePanelBill() {
            if (!targetedActiveStationId) return;
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            const surchargeField = document.getElementById('surcharge-fee');
            
            let tempMisc = station.miscServiceFee;
            if(surchargeField) tempMisc = parseFloat(surchargeField.value) || 0;

            const baseCost = (station.durationMinutes / 60) * globalHourlyRate;
            const foodCost = station.foodHistory.reduce((sum, f) => sum + (f.price * f.qty), 0);
            const extraTimeTotal = station.extraTimeCost || 0;
            
            document.getElementById('panel-bill-display').textContent = `₹${(baseCost + foodCost + tempMisc + extraTimeTotal).toFixed(2)}`;
        }

        function endSessionManually() {
            const station = stationsData.find(s => s.id === targetedActiveStationId);
            station.status = 'SETTLING';
            processSessionSettlement(station.id);
        }

        function processSessionSettlement(stationId) {
            if (!stationId) return;
            const station = stationsData.find(s => s.id === stationId);
            
            if (stationId === targetedActiveStationId) {
                const finalSurchargeField = document.getElementById('surcharge-fee');
                if (finalSurchargeField) {
                    station.miscServiceFee = parseFloat(finalSurchargeField.value) || 0;
                }
            }

            const statements = calculateTotalBalanceSheet(station);
            
            const logEntry = {
                id: 'LOG_' + Date.now(),
                stationId: station.id,
                duration: station.durationMinutes + station.extraTimeAdded,
                players: station.playersCount,
                playerNames: station.playerNames,
                foodHistory: JSON.parse(JSON.stringify(station.foodHistory)), 
                statements: statements,
                timestamp: new Date().toLocaleDateString() + ' ' + get12HourTime(new Date())
            };
            
            systemAuditLogs.unshift(logEntry); // Add to top of history
            saveSystemData();

            // Open Bill Modal
            renderBillReceipt(logEntry.id, true, station.id);
        }

        // --- In-Browser App Bill Modal ---
        function renderBillReceipt(logId, isImmediateSettlement, stationId = null) {
            const log = systemAuditLogs.find(l => l.id === logId);
            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');

            titleField.textContent = `🧾 Bill - P${log.stationId}`;

            let itemsHtml = log.foodHistory.map(item => `
                <div class="invoice-line" style="font-size:0.85rem;">
                    <span style="color:#ccc;">${item.name} <strong style="color:#e066ff;">(x${item.qty})</strong></span>
                    <span>₹${(item.price * item.qty).toFixed(2)}</span>
                </div>
            `).join('');

            let namesHtml = log.playerNames ? `<div style="color:#00ff66; font-size:0.95rem; margin-bottom:15px; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">👥 ${log.playerNames}</div>` : '';

            let actionBtn = isImmediateSettlement 
                ? `<button class="action-button success-btn" onclick="flushStationSlot(${stationId})">✅ Clear Station & Close</button>`
                : `<button class="action-button" onclick="openSystemLogsModal()">⬅ Back to History</button>`;

            bodyField.innerHTML = `
                <div class="invoice-block" style="text-align:left;">
                    ${namesHtml}
                    <div class="invoice-line" style="font-size:0.9rem; color:#fff; font-weight:bold;">
                        <span>Session Play Time (${log.duration} Mins)</span>
                        <span>₹${log.statements.playCost.toFixed(2)}</span>
                    </div>
                    ${log.statements.extraTime > 0 ? `
                    <div class="invoice-line" style="font-size:0.85rem; color:#ccc;">
                        <span>Extra Time Surcharge</span>
                        <span>₹${log.statements.extraTime.toFixed(2)}</span>
                    </div>` : ''}
                    ${log.statements.miscCost > 0 ? `
                    <div class="invoice-line" style="font-size:0.85rem; color:#ccc;">
                        <span>Misc Surcharges</span>
                        <span>₹${log.statements.miscCost.toFixed(2)}</span>
                    </div>` : ''}
                    
                    <div style="margin-top:15px; margin-bottom:5px; font-weight:bold; color:#b200ff; border-bottom:1px solid rgba(178,0,255,0.3); padding-bottom:5px;">Add-ons & Refreshments</div>
                    ${itemsHtml || '<div style="color:#666; font-size:0.8rem; font-style:italic;">No items ordered.</div>'}

                    <div class="summary-total-strip" style="margin-top:20px;">
                        <span class="total-label">Grand Total</span>
                        <span class="total-price" style="font-size:1.8rem;">₹${log.statements.grandTotal.toFixed(2)}</span>
                    </div>
                    
                    <div style="margin-top: 25px;">
                        ${actionBtn}
                    </div>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function flushStationSlot(stationId) {
            const station = stationsData.find(s => s.id === stationId);
            station.status = 'AVAILABLE';
            station.timeRemaining = 0;
            station.startTimestamp = null;
            station.endTimestamp = null;
            station.playerNames = '';
            station.foodHistory = [];
            station.miscServiceFee = 0;
            station.extraTimeCost = 0;
            station.extraTimeAdded = 0;

            saveSystemData();
            refreshDashboardVisuals();
            closeTopModal();
        }

        // --- Header Menu Modal Actions ---
        function openAdminModal() {
            document.getElementById('mainMenu').classList.remove('show');
            
            if (!isAdminAuthenticated) {
                const pwd = prompt("System Administrator Override\nEnter Admin Password (default: admin):");
                if (pwd === VALID_ADMIN_PASSWORD) {
                    isAdminAuthenticated = true;
                } else {
                    alert("Authentication Failed. Access Denied.");
                    return;
                }
            }

            targetedActiveStationId = null;
            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');

            titleField.textContent = "⚙️ Admin Control Panel";

            let inventoryHtml = inventoryData.map((item, i) => `
                <div class="admin-row">
                    <input type="text" value="${item.name}" id="inv_name_${i}">
                    <input type="number" value="${item.price}" id="inv_price_${i}" step="0.01">
                    <input type="number" value="${item.stock}" id="inv_stock_${i}">
                    <button class="action-button" style="margin:0; padding:10px 15px;" onclick="updateInventoryItem(${i})">Save</button>
                </div>
            `).join('');

            bodyField.innerHTML = `
                <div class="form-group">
                    <label>Global Hourly Console Rate (₹)</label>
                    <div style="display:flex; gap:10px;">
                        <input type="number" id="admin_hourly_rate" value="${globalHourlyRate}" step="0.5">
                        <button class="action-button" style="margin:0; padding:10px; width:auto;" onclick="updateGlobalRate()">Update Rate</button>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 30px; font-size: 0.9rem;">Inventory Management</div>
                <div class="admin-row" style="margin-bottom: 5px;">
                    <label style="font-size: 0.7rem; font-weight: bold; color: #ccc; text-transform: uppercase;">Item Name</label>
                    <label style="font-size: 0.7rem; font-weight: bold; color: #ccc; text-transform: uppercase;">Price (₹)</label>
                    <label style="font-size: 0.7rem; font-weight: bold; color: #ccc; text-transform: uppercase;">Stock Qty</label>
                    <label></label>
                </div>
                ${inventoryHtml}

                <div class="section-title" style="margin-top: 30px; font-size: 0.9rem;">Add New Inventory Item</div>
                <div class="admin-row" style="margin-bottom: 8px;">
                    <input type="text" id="new_item_name" placeholder="Item Name">
                    <input type="number" id="new_item_price" placeholder="Price" step="0.01">
                    <input type="number" id="new_item_stock" placeholder="Initial Stock">
                    <button class="action-button success-btn" style="margin:0; padding:10px 15px;" onclick="addNewInventoryItem()">Add</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function updateGlobalRate() {
            const newRate = parseFloat(document.getElementById('admin_hourly_rate').value);
            if (!isNaN(newRate) && newRate > 0) {
                globalHourlyRate = newRate;
                saveSystemData();
                alert(`Global rate updated to ₹${globalHourlyRate}/hr successfully.`);
            }
        }

        function updateInventoryItem(index) {
            const newName = document.getElementById(`inv_name_${index}`).value;
            const newPrice = parseFloat(document.getElementById(`inv_price_${index}`).value);
            const newStock = parseInt(document.getElementById(`inv_stock_${index}`).value);

            if (newName && !isNaN(newPrice) && !isNaN(newStock)) {
                inventoryData[index].name = newName;
                inventoryData[index].price = newPrice;
                inventoryData[index].stock = newStock;
                saveSystemData();
                alert(`Inventory item [${newName}] updated.`);
                openAdminModal(); 
            }
        }

        function addNewInventoryItem() {
            const name = document.getElementById('new_item_name').value;
            const price = parseFloat(document.getElementById('new_item_price').value);
            const stock = parseInt(document.getElementById('new_item_stock').value);

            if (name && !isNaN(price) && !isNaN(stock)) {
                inventoryData.push({
                    id: `inv_${new Date().getTime()}`,
                    name: name,
                    price: price,
                    stock: stock
                });
                saveSystemData();
                openAdminModal(); 
            } else {
                alert("Please fill out all fields with valid data.");
            }
        }

        function openSystemLogsModal() {
            document.getElementById('mainMenu').classList.remove('show');
            targetedActiveStationId = null;
            
            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');

            titleField.textContent = "📜 System Transaction Logs";

            if (systemAuditLogs.length === 0) {
                bodyField.innerHTML = `<p style="text-align:center; padding:30px; color:#aaa;">No historical session entries found in this runtime environment.</p>`;
            } else {
                let logRowsHtml = systemAuditLogs.map(log => {
                    let totalItems = log.foodHistory.reduce((sum, f) => sum + f.qty, 0);
                    return `
                    <tr>
                        <td>P${log.stationId}</td>
                        <td>${log.duration}m</td>
                        <td style="max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${log.playerNames || log.players}</td>
                        <td>${totalItems} Items</td>
                        <td style="color:#00ff66; font-weight:700;">₹${log.statements.grandTotal.toFixed(2)}</td>
                        <td><button class="action-button small-btn" style="padding: 4px 8px; margin:0;" onclick="renderBillReceipt('${log.id}', false)">View</button></td>
                    </tr>
                `}).join('');

                bodyField.innerHTML = `
                    <div class="log-table-wrapper">
                        <table class="log-table">
                            <thead>
                                <tr>
                                    <th>Stn</th>
                                    <th>Time</th>
                                    <th>Names</th>
                                    <th>Food</th>
                                    <th>Total</th>
                                    <th>Bill</th>
                                </tr>
                            </thead>
                            <tbody>${logRowsHtml}</tbody>
                        </table>
                    </div>
                `;
            }
            document.getElementById('modal-overlay').classList.add('active');
        }

        function openMembershipModal() {
            document.getElementById('mainMenu').classList.remove('show');
            targetedActiveStationId = null;
            
            const titleField = document.getElementById('modal-title-field');
            const bodyField = document.getElementById('modal-injected-body');

            titleField.textContent = "💎 Membership Management";
            bodyField.innerHTML = `
                <div style="text-align:center; padding:40px; color:#aaa;">
                    <p style="font-size:1.1rem; color:#e066ff; margin-bottom:10px;">Membership Module Coming Soon</p>
                    <p style="font-size:0.85rem; line-height:1.5;">Future updates will include loyalty points, registered player profiles, VIP discounts, and automated wallet balances.</p>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        // --- Persistent Dynamic Tick Engine ---
        setInterval(() => {
            const now = new Date();
            stationsData.forEach(station => {
                if (station.status === 'IN_USE' && station.endTimestamp) {
                    
                    // Dynamically calculate remaining time based on actual clock time (prevents background drift)
                    const diffSeconds = Math.floor((station.endTimestamp - now) / 1000);
                    station.timeRemaining = Math.max(0, diffSeconds);

                    const gridTimer = document.getElementById(`grid-timer-${station.id}`);
                    if (gridTimer) {
                        gridTimer.textContent = formatTime(station.timeRemaining);
                        gridTimer.className = `card-timer ${getTimerColorClass(station.timeRemaining, (station.durationMinutes + station.extraTimeAdded) * 60)}`;
                    }

                    if (targetedActiveStationId === station.id) {
                        const modalTimer = document.getElementById('modal-live-timer');
                        if (modalTimer) {
                            modalTimer.textContent = formatTime(station.timeRemaining);
                            modalTimer.style.color = station.timeRemaining <= 0 ? '#ff3333' : '#00ff66';
                        }
                    }

                    if (station.timeRemaining <= 0) {
                        notifySessionEnd(station.id);
                        station.status = 'SETTLING';
                        processSessionSettlement(station.id);
                    }
                }
            });
        }, 1000);

        // --- Application Boot Initialization ---
        window.onload = () => {
            checkLoginState();
        };

    </script>
</body>
</html>
